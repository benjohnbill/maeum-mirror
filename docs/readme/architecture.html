<title>Herz Architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one wide system diagram, three clusters left to right, the absent DB below the server. */
:root {
  --bg: #ffffff;
  --fg: #1f2937;
  --muted: #64748b;
  --panel: #e8f4fb;
  --panel-stroke: #b6d9ea;
  --edge: #8a97a8;
  --ok: #15803d;
  --no: #c2410c;
  --chip: #111827;
  --font: "Inter", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1419; --fg: #e5e7eb; --muted: #94a3b8; --panel: #15232e; --panel-stroke: #2c4a5c;
    --edge: #7c8a9c; --ok: #4ade80; --no: #fb923c; --chip: #0b0f14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1419; --fg: #e5e7eb; --muted: #94a3b8; --panel: #15232e; --panel-stroke: #2c4a5c;
  --edge: #7c8a9c; --ok: #4ade80; --no: #fb923c; --chip: #0b0f14; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font); }
main { max-width: 1180px; margin: 0 auto; padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
.lead { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
figure { margin: 0; }
.scroll { overflow-x: auto; }
svg.arch { display: block; width: 100%; height: auto; color: var(--fg); }
figcaption { margin-top: 14px; color: var(--muted); font-size: 13px; text-align: center; }
.grp { fill: var(--panel); stroke: var(--panel-stroke); stroke-width: 1.2; }
.gt { fill: var(--fg); font-size: 13px; font-weight: 600; }
.lbl { fill: var(--fg); font-size: 15px; font-weight: 700; text-anchor: middle; }
.sub { fill: var(--muted); font-size: 12px; text-anchor: middle; }
.el { fill: var(--muted); font-size: 12px; }
.edge { stroke: var(--edge); stroke-width: 1.6; fill: none; }
.dash { stroke-dasharray: 5 5; }
.head { fill: var(--edge); }
.fg { fill: var(--fg); }
.ok { fill: var(--ok); font-size: 12.5px; font-weight: 600; }
.no { stroke: var(--no); stroke-width: 2.4; fill: none; stroke-linecap: round; }
.noTxt { fill: var(--no); font-size: 15px; font-weight: 700; }
.nobox { fill: none; stroke: var(--edge); stroke-width: 1.4; stroke-dasharray: 6 5; }
.card { fill: var(--bg); stroke: var(--panel-stroke); }
.chip { fill: var(--chip); }
</style>
