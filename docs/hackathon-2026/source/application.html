#id-a23944a2-6ce1-4f26-b72b-a8aa0948923c p {\n  margin-bottom: 0 !important;\n}\n\n/* 설명을 제목 쪽으로 당기기 */\n#id-25958caf-3218-4582-b9d7-a698e15aaecd {\n  margin-top: -10px !important;\n  padding-top: 0 !important;\n}\n\n#id-25958caf-3218-4582-b9d7-a698e15aaecd \u003e div:not(.adminGuide) {\n  padding-top: 0 !important;\n}\n\n#id-25958caf-3218-4582-b9d7-a698e15aaecd h6 {\n  margin-top: 0 !important;\n}\n\n#id-25958caf-3218-4582-b9d7-a698e15aaecd p {\n  margin-top: 0 !important;\n}\n\n/* 모바일: 텍스트 영역 전체 너비 */\n.CareerGrid-item:has(.block-rich-text):where(.is-mobile *) {\n  width: 100% !important;\n  max-width: 100% !important;\n  flex-basis: 100% !important;\n}\n\n/* 모바일: 버튼 블록 전체 너비 */\n.block-button:where(.is-mobile *) {\n  width: 100% !important;\n}\n\n/* 모바일: 버튼을 가운데에 세로 배치 */\n.block-button \u003e .CareerStack-root:where(.is-mobile *) {\n  display: flex !important;\n  flex-direction: column !important;\n  align-items: center !important;\n  width: 100% !important;\n  gap: 10px !important;\n}\n\n/* 모바일: 글자 길이에 맞는 버튼 너비 */\n.block-button .CareerButton-root:where(.is-mobile *) {\n  box-sizing: border-box !important;\n  flex: 0 0 auto !important;\n  align-self: center !important;\n  width: auto !important;\n  max-width: 100% !important;\n  min-width: 0 !important;\n  margin: 0 !important;\n  white-space: normal !important;\n}\n","sectionType":"section-image-with-text"},{"ver":1,"path":"notice-faq","uuid":"id-9a1b3c6d-9262-4198-a96a-793606337c4c","blocks":[],"disabled":false,"settings":[{"key":"section_code","type":"CODE-EDITOR-HTML","value":"\u003cscript\u003e\n/* 메인 공지사항·자주 묻는 질문 ← /notice·/faq 아코디언 블록 동기화\n   - 빌더 코드 섹션은 iframe 안에서 돌아가므로 바깥 페이지(parent)를 대상으로 동작한다.\n   - 메인에서 제목(ACC[].label)이 붙은 아코디언 섹션을 찾아, 그 블록들에\n     원본 페이지(ACC[].sourcePath)의 아코디언 블록(질문·답변)을 순서대로 채운다.\n   - 메인 블록 수 또는 max 중 작은 값까지만 보여주고, 남는 블록과 그 구분선은 숨긴다.\n   - 원본 페이지 순서 그대로 가져오므로, 최신 공지를 위에 두려면 /notice에서 블록 순서를 위로.\n   - 메인에 박힌 데이터로 먼저 채우고, 원본 페이지를 한 번 더 읽어 최신 데이터로 덮어쓴다.\n   - 빌더 편집 화면에서는 동작하지 않음. 실제 사이트에서 확인할 것. */\n(function () {\n  var doc = document;\n  try { if (window.parent \u0026\u0026 window.parent !== window \u0026\u0026 window.parent.document) doc = window.parent.document; } catch (e) {}\n  var win = doc.defaultView || window;\n\n  var ACC = [\n    { label: \"공지사항\",      sourcePath: \"notice\", max: 5 },   // 메인에 보여줄 최대 개수\n    { label: \"자주 묻는 질문\", sourcePath: \"faq\",    max: 5 }\n  ];\n\n  var fresh = {};\n\n  function findSection(label) {\n    var secs = doc.querySelectorAll(\".section-accordion\");\n    for (var i = 0; i \u003c secs.length; i++) {\n      var h = secs[i].querySelector(\"h1,h2,h3,h4\");\n      var t = h ? (h.textContent || \"\").replace(/\\s+/g, \" \").trim() : \"\";\n      if (t.indexOf(label) === 0) return secs[i];\n    }\n    return null;\n  }\n  function extractItems(nd, path) {\n    var pages = nd.props.pageProps.middlewareData.companyDataFromSubdomain.dsgnInf.dsgnCntn.pages;\n    var page = pages.filter(function (p) { return p.path === path; })[0];\n    if (!page) return [];\n    var items = [];\n    (page.sections || []).forEach(function (sec) {\n      (sec.blocks || []).forEach(function (b) {\n        if (b.blockType !== \"block-accordion-column\" || b.disabled) return;\n        var get = function (k) { var s = (b.settings || []).filter(function (x) { return x.key === k; })[0]; return s ? s.value : \"\"; };\n        items.push({ q: get(\"question_text\"), a: get(\"answer_text\") });\n      });\n    });\n    return items;\n  }\n  function readItems(path) {\n    if (fresh[path]) return fresh[path];\n    try { return extractItems(JSON.parse(doc.getElementById(\"__NEXT_DATA__\").textContent), path); } catch (e) { return []; }\n  }\n  function refresh(path) {\n    try {\n      win.fetch(\"/\" + path + \"?_=\" + Date.now(), { cache: \"no-store\" })\n        .then(function (r) { return r.text(); })\n        .then(function (html) {\n          var m = html.match(/\u003cscript id=\"__NEXT_DATA__\"[^\u003e]*\u003e([\\s\\S]*?)\u003c\\/script\u003e/);\n          if (!m) return;\n          var items = extractItems(JSON.parse(m[1]), path);\n          if (items.length) { fresh[path] = items; ACC.forEach(apply); }\n        }).catch(function () {});\n    } catch (e) {}\n  }\n\n  function setVisible(el, visible) {\n    if (!el) return;\n    if (visible) { if (el.style.display) el.style.display = \"\"; }\n    else if (el.style.display !== \"none\") el.style.display = \"none\";\n  }\n\n  function apply(job) {\n    var sec = findSection(job.label);\n    if (!sec) return false;\n    var blocks = sec.querySelectorAll(\".block-accordion-column\");\n    if (!blocks.length) return false;\n    var items = readItems(job.sourcePath);\n    if (!items.length) return true;\n    var show = Math.min(items.length, blocks.length, job.max || 99);\n    blocks.forEach(function (blk, i) {\n      var next = blk.nextElementSibling;                                   /* 블록 뒤 구분선 */\n      var divider = (next \u0026\u0026 !next.classList.contains(\"block-accordion-column\")) ? next : null;\n      if (i \u003c show) {\n        var q = blk.querySelector(\".accordion-column-block-question-text\");\n        var a = blk.querySelector(\".accordion-column-block-answer-text\");\n        if (q \u0026\u0026 q.innerHTML !== items[i].q) q.innerHTML = items[i].q;\n        if (a \u0026\u0026 a.innerHTML !== (items[i].a || \"\")) a.innerHTML = items[i].a || \"\";\n        setVisible(blk, true); setVisible(divider, true);\n      } else {\n        setVisible(blk, false); setVisible(divider, false);\n      }\n    });\n    return true;\n  }\n\n  var tries = 0;\n  function run() { tries++; var done = ACC.every(apply); if (!done \u0026\u0026 tries \u003c 20) setTimeout(run, 500); }\n  function start() {\n    run();\n    ACC.forEach(function (j) { refresh(j.sourcePath); });\n    var root = doc.body || doc.documentElement;\n    if (!root) return;\n    var pending;\n    new MutationObserver(function () { clearTimeout(pending); pending = setTimeout( }\n","sectionType":"section-card-view"},{"ver":1,"path":"","uuid":"id-8a039866-db35-4f0c-97f4-3ede13a4c332","blocks":[{"ver":1,"path":"","uuid":"id-eb5ebbcf-af52-4ccb-9fc2-7c3bfc97df0d","disabled":true,"settings":[{"key":"text","type":"RICHTEXT","value":"\u003cp\u003e\u003cstrong\u003e오시는 길\u003c/strong\u003e\u003c/p\u003e"},{"key":"text_size","type":"TEXT-SIZE","value":"h4"},{"key":"text_font","type":"SELECT-FONT","value":"theme"},{"key":"text_color","type":"COLOR","value":"#212121"}],"blockType":"block-rich-text","customCss":""}],"disabled":false,"settings":[{"key":"image_url","type":"IMAGE-LIBRARY","value":""},{"key":"image_aspect_ratio","type":"ASPECT-RATIO","value":"adapt"},{"key":"setting_divider","type":"SETTING-DIVIDER","value":""},{"key":"sub_background_color","type":"COLOR-ALLOW-EMPTY","value":""},{"key":"sub_background_image_stretch","type":"CHECKBOX","value":"false"},{"key":"sub_background_border_radius","type":"RANGE-PX-0-36","value":"16"},{"key":"desktop_image_column_width","type":"RANGE-DOZEN-3-9","value":"6"},{"key":"desktop_image_width","type":"RANGE-PERCENT-50-100","value":"100"},{"key":"desktop_image_align","type":"BOX-ALIGN-LEFT-RIGHT","value":"left"},{"key":"desktop_contents_align_x","type":"LAYOUT-ALIGN-X","value":"start"},{"key":"desktop_contents_align_y","type":"LAYOUT-ALIGN-Y","value":"center"},{"key":"mobile_image_width","type":"RANGE-PERCENT-50-100","value":"100"},{"key":"mobile_image_align","type":"BOX-ALIGN-TOP-BOTTOM","value":"top"},{"key":"mobile_contents_align_x","type":"LAYOUT-ALIGN-X","value":"start"},{"key":"section_background_color","type":"COLOR-ALLOW-EMPTY","value":""},{"key":"padding_top","type":"RANGE-PX-0-240","value":"80"},{"key":"padding_bottom","type":"RANGE-PX-0-240","value":"0"},{"key":"transition","type":"TRANSITION","value":"none"}],"customCss":"","sectionType":"section-image-with-text"},{"ver":1,"path":"","uuid":"id-5d35e7b5-ef1c-4da5-9e7b-609df8873987","blocks":[],"disabled":false,"settings":[{"key":"section_code","type":"CODE-EDITOR-HTML","value":"\u003cstyle\u003e\n/* ============================================================\n   주최·주관·후원 로고 영역 — 로고 창고(숨김 카드뷰)에서 자동으로 읽어옴\n\n   로고 관리는 빌더의 숨김 카드뷰 섹션(\"로고 창고\")에서만 하면 됨\n   - 카드 제목: \"주최 기관명\" / \"주관 기관명\" / \"후원 기업명\" (구분 + 띄어쓰기 + 이름)\n   - 카드 이미지: 로고 (여백 없이 딱 맞게 자른 투명 PNG 권장)\n   - 이미지 클릭 액션: 로고 클릭 시 이동할 주소 (없으면 비워두기)\n   - 이미지가 없는 카드, 로고가 하나도 없는 구분(예: 주최)은 자동으로 안 보임\n   - 카드 순서 = 화면에 나오는 순서\n   - 빌더 편집 화면에서는 동작하지 않음. 실제 사이트에서 확인할 것.\n   ============================================================ */\n:root{\n  --ink:#212121;       /* 라벨(주관·후원) 글자색 — 어두운 배경이면 #ffffff */\n  --logo-h:30px;       /* 이미지 로딩 전 임시 높이 (실제 크기는 아래 스크립트 SIZE에서 자동 계산) */\n  --k:1;               /* PC 배율 (모바일은 아래 @media에서 .7) */\n  --gap-x:36px;        /* PC 로고 사이 가로 간격 */\n  --gap-y:20px;        /* PC 줄 사이 세로 간격 */\n  --font:\"Pretendard\",\"Noto Sans KR\",-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Malgun Gothic\",sans-serif;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;overflow:hidden;background:transparent}\nbody{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;padding:8px 16px}\n.groups{display:flex;flex-direction:column;gap:32px}\n.group{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:start}\n.label{font-size:15px;font-weight:700;line-height:var(--logo-h)}\n.rows{display:flex;flex-wrap:wrap;align-items:center;gap:var(--gap-y) var(--gap-x)}\n.rows a,.rows span{display:block;line-height:0}\n.rows img{height:var(--logo-h);width:auto;max-width:240px;object-fit:contain;display:block}\n@media (max-width:767px){\n  .groups{gap:24px}\n  .group{grid-template-columns:1fr;gap:12px}\n  .label{line-height:1.4;font-size:14px}\n  .rows{gap:14px 22px}\n  :root{--k:.7}\n  .rows img{max-width:170px}\n}\n\u003c/style\u003e\n\n\u003cdiv class=\"groups\" id=\"groups\"\u003e\u003c/div\u003e\n\n\u003cscript\u003e\n(function () {\n  var ORDER = [\"주최\", \"주관\", \"후원\"];     /* 표시 순서 */\n\n  /* 로고 크기 자동 맞춤: 같은 높이가 아니라 \"눈에 보이는 면적\"이 비슷하도록 계산\n     - 가로로 긴 로고(SAMSUNG 등)는 낮게, 네모에 가까운 로고(심볼형)는 높게 */\n  var SIZE = {\n    base: 34,    /* 기준 높이(px) — 전체적으로 키우려면 이 숫자를 올리기 */\n    ref: 3,      /* 기준 비율(가로÷세로). 이 비율의 로고가 base 높이가 됨 */\n    k: 0.5,      /* 보정 강도 0~1 (0 = 모두 같은 높이, 1 = 완전 같은 면적) */\n    min: 22,     /* 최소 높이(px) */\n    max: 42      /* 최대 높이(px) */\n  };\n\n  /* 로고별 추가 보정 (선택): 자동 계산 후에도 유난히 작거나 커 보이는 로고만 배율 지정\n     이름은 카드 제목에서 \"후원 \" 뒤 부분 그대로. 1보다 크면 커지고, 작으면 작아짐 */\n  var SCALE = {\n    \"대한상공회의소\": 1.2,\n    \"KT\": 0.85,\n    \"한화오션엔지니어링\": 1.15,\n    \"CJ올리브네트웍스\": 1.1,\n    \"SK주식회사\": 1.35,\n    \"SK플래닛\": 1.3,\n    \"SK하이닉스\": 1.3,\n    \"삼성그룹\": 0.9,\n    \"롯데지주\": 1.1\n  };\n\n  var doc = document, top = document;\n  try { if (window.parent \u0026\u0026 window.parent !== window \u0026\u0026 window.parent.document) top = window.parent.document; } catch (e) {}\n\n  function esc(s){ return String(s||\"\").replace(/[\u0026\u003c\u003e\"]/g,function(c){return {\"\u0026\":\"\u0026amp;\",\"\u003c\":\"\u0026lt;\",\"\u003e\":\"\u0026gt;\",'\"':\"\u0026quot;\"}[c];}); }\n  function plain(html){ return String(html||\"\").replace(/\u003c[^\u003e]+\u003e/g,\" \").replace(/\u0026nbsp;/g,\" \").replace(/\\s+/g,\" \").trim(); }\n\n  /* 사이트 데이터에서 \"주최/주관/후원 ...\" 제목 카드를 모두 모음 (숨김 섹션 포함, 모든 페이지 검색) */\n  var fresh = null;   /* 최신 데이터(캐시 우회로 다시 받아온 것) */\n  function collect() {\n    var nd = fresh;\n    if (!nd) { try { nd = JSON.parse(top.getElementById(\"__NEXT_DATA__\").textContent); } catch (e) { return null; } }\n    var pages = nd.props.pageProps.middlewareData.companyDataFromSubdomain.dsgnInf.dsgnCntn.pages || [];\n    var groups = {};\n    pages.forEach(function (p) {\n      (p.sections || []).forEach(function (sec) {\n        (sec.blocks || []).forEach(function (b) {\n          if (b.blockType !== \"block-card-view-column\" || b.disabled) return;\n          var get = function (k) { var s = (b.settings || []).filter(function (x) { return x.key === k; })[0]; return s ? s.value : \"\"; };\n          var title = plain(get(\"heading\"));\n          var m = title.match(/^(주최|주관|후원)\\s+(.+)$/);\n          var img = String(get(\"image_url\") || \"\").trim();\n          if (!m || img.indexOf(\"http\") !== 0) return;\n          (groups[m[1]] = groups[m[1]] || []).push({ name: m[2], img: img, link: String(get(\"image_click\") || \"\").trim() });\n        });\n      });\n    });\n    return groups;\n  }\n\n  function fit() {\n    try {\n      var f = window.frameElement;\n      if (f) { var h = doc.documentElement.scrollHeight; if (Math.abs(f.offsetHeight - h) \u003e 1) f.style.height = h + \"px\"; }\n    } catch (e) {}\n  }\n\n  /* 이미지 원본 비율로 높이 계산 */\n  function size(im) {\n    var r = im.naturalWidth / im.naturalHeight;\n    if (!r || !isFinite(r)) return;\n    var h = SIZE.base * Math.pow(r / SIZE.ref, -SIZE.k);\n    h = Math.max(SIZE.min, Math.min(SIZE.max, h));\n    h = h * (SCALE[im.getAttribute(\"data-name\")] || 1);\n    im.style.height = \"calc(\" + h.toFixed(1) + \"px * var(--k))\";\n    fit();\n  }\n\n  function render() {\n    var groups = collect();\n    if (!groups) return false;\n    var html = \"\";\n    ORDER.forEach(function (label) {\n      var items = groups[label];\n      if (!items || !items.length) return;\n      html += '\u003cdiv class=\"group\"\u003e\u003cdiv class=\"label\"\u003e' + esc(label) + '\u003c/div\u003e\u003cdiv class=\"rows\"\u003e';\n      items.forEach(function (it) {\n        var img = '\u003cimg src=\"' + esc(it.img) + '\" alt=\"' + esc(it.name) + '\" data-name=\"' + esc(it.name) + '\"\u003e';\n        html += it.link\n          ? '\u003ca href=\"' + esc(it.link) + '\" target=\"_blank\" rel=\"noopener\" title=\"' + esc(it.name) + '\"\u003e' + img + '\u003c/a\u003e'\n          : '\u003cspan title=\"' + esc(it.name) + '\"\u003e' + img + '\u003c/span\u003e';\n      });\n      html += '\u003c/div\u003e\u003c/div\u003e';\n    });\n    doc.getElementById(\"groups\").innerHTML = html;\n    [].forEach.call(doc.images, function (im) {\n      if (im.complete \u0026\u0026 im.naturalWidth) size(im); else im.addEventListener(\"load\", function () { size(im); });\n    });\n    fit();\n    return true;\n  }\n\n  /* 페이지에 박힌 데이터는 캐시로 늦게 갱신될 수 있어, 현재 페이지를 한 번 더 받아 최신 로고로 다시 그림 */\n  function refresh() {\n    try {\n      var w = top.defaultView || window;\n      w.fetch(w.location.pathname + \"?_=\" + Date.now(), { cache: \"no-store\" })\n        .then(function (r) { return r.text(); })\n        .then(function (html) {\n          var m = html.match(/\u003cscript id=\"__NEXT_DATA__\"[^\u003e]*\u003e([\\s\\S]*?)\u003c\\/script\u003e/);\n          if (!m) return;\n          fresh = JSON.parse(m[1]);\n          render();\n        }).catch(function () {});\n    } catch (e) {}\n  }\n\n  var tries = 0;\n  (function run() { tries++; if (!render() \u0026\u0026 tries \u003c 20) setTimeout(run, 300); })();\n  refresh();\n  window.addEventListener(\"resize\", fit);\n  setTimeout(fit, 1000);\n})();\n\u003c/script\u003e"},{"key":"setting_divider","type":"SETTING-DIVIDER","value":""},{"key":"desktop_full_width","type":"CHECKBOX","value":"false"},{"key":"mobile_full_width","type":"CHECKBOX","value":"false"},{"key":"section_background_color","type":"COLOR-ALLOW-EMPTY","value":""},{"key":"padding_top","type":"RANGE-PX-0-240","value":"0"},{"key":"padding_bottom","type":"RANGE-PX-0-240","value":"40"},{"key":"transition","type":"TRANSITION","value":"none"}],"customCss":"","sectionType":"section-code"},{"ver":1,"path":"","uuid":"id-e7587f52-c3e9-4042-9fe4-4578632b9c42","blocks":[{"ver":1,"path":"","uuid":"id-5d4f3e21-5c0a-4348-98e2-9ed96e0bb2c2","disabled":false,"settings":[{"key":"text","type":"RICHTEXT","value":"\u003cp\u003e\u003cstrong style=\"color: rgb(17, 87, 222);\"\u003e오시는 길\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong style=\"font-size: 1.25em;\"\u003e대한상공회의소 B2 국제회의장\u003c/strong\u003e\u003c/p\u003e"},{"key":"text_size","type":"TEXT-SIZE","value":"h6"},{"key":"text_fon 03e\u003c/p\u003e"},{"key":"answer_text","type":"RICHTEXT","value":"\u003cp\u003e이번  「2026 대한민국 청년 CAREER FAIR」 에서는 대한상공회의소에서 운영지원하는 KDT ·K-뉴딜 아카데미 훈련생 및 수료생을 위한\u003cstrong\u003e 'AI 해커톤'\u003c/strong\u003e을 개최합니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e일상과 산업 현장에서 해결하고 싶은 문제를 직접 발굴하고, AI 기술을 활용해 작동하는 프로토타입을 구현하는 「2026 대한민국 청년 CAREER FAIR AI 해커톤」에 많은 관심 부탁드리겠습니다. \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e■ 모집 개요\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e참가 대상 : \u003c/strong\u003e대한상공회의소가 운영지원하는 첨단산업·디지털 선도기업 아카데미 또는 K-뉴딜 아카데미 과정에 참여 중이거나 수료한 청년\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e참가 형태 : \u003c/strong\u003e개인 또는 팀(1~4인)\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e접수 기간 : \u003c/strong\u003e2026년 11월 9일(월) 10:00 ~ 11월 23일(월) 17:00\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e신청 방법 : \u003c/strong\u003e공식 홈페이지의 ‘AI 해커톤’ 페이지에서 참가 신청서를 제출해 주세요.\u003c/li\u003e\u003cli\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e■ 프로젝트 제출\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e참가 신청 후 제공되는 가이드에 따라 \u003cstrong\u003e프로젝트 소개서, 3분 이내 시연 영상, 실행 가능한 프로토타입, AI 활용 내역, 개발 설명자료\u003c/strong\u003e를 제출해 주세요. 제출 양식과 세부 기준은 대회 안내문에서 확인하실 수 있습니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e■ 주요 일정\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e사전심사 :  \u003c/strong\u003e2026년 11월 24일(화) ~ 11월 30일(월)\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e본선 진출팀 발표 : \u003c/strong\u003e2026년 11월 30일(월) 18:00\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e본선 발표 및 시연 : \u003c/strong\u003e2026년 12월 7일(월) 14:00~17:00\u003c/p\u003e\u003cp\u003e*본선 진출팀의 경우 팀 대표에게 개별 안내 예정\u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003eAI 기술을 활용해 직접 문제를 해결해 보고 싶은 분들의 많은 참여를 바랍니다.\u003c/p\u003e"},{"key":"filter_apply_list","type":"TEXT","value":""}],"blockType":"block-accordion-column","customCss":""},{"ver":1,"path": 3e검색\u003c/button\u003e\n  \u003c/form\u003e\n  \u003cp id=\"fair-search-result\" role=\"status\" aria-live=\"polite\"\u003e\u003c/p\u003e\n\u003c/div\u003e\n\n\u003cscript\u003e\n(() =\u003e {\n  const form = document.getElementById(\"fair-search-form\");\n  const input = document.getElementById(\"fair-search-input\");\n  const result = document.getElementById(\"fair-search-result\");\n  const sectionId = \"id-ed591824-a62c-4c6f-895d-17dd0edef691\";\n\n  const originalDisplays = new WeakMap();\n\n  const normalize = value =\u003e\n    value.normalize(\"NFKC\").replace(/\\s+/g, \"\").toLowerCase();\n\n  const collator = new Intl.Collator(\"ko\", {\n    numeric: true,\n    sensitivity: \"base\"\n  });\n\n  function findSection() {\n    const local = document.getElementById(sectionId);\n    if (local) return local;\n\n    try {\n      return window.parent.document.getElementById(sectionId);\n    } catch {\n      return null;\n    }\n  }\n\n  function update(showErrors) {\n    const section = findSection();\n\n    if (!section) {\n      if (showErrors) {\n        result.textContent = \"기업 목록에 접근할 수 없습니다.\";\n      }\n      return false;\n    }\n\n    const cards = Array.from(\n      section.querySelectorAll(\".block-card-view-column\")\n    );\n\n    if (!cards.length) {\n      if (showErrors) {\n        result.textContent = \"기업 카드 구조를 확인해야 합니다.\";\n      }\n      return false;\n    }\n\n    const entries = cards.map(card =\u003e {\n      const heading = card.querySelector(\"h5, .CareerTypography-h5\");\n      const grid = card.closest(\".CareerGrid-item\");\n\n      return {\n        heading,\n        target: grid \u0026\u0026 section.contains(grid) ? grid : card\n      };\n    });\n\n    if (entries.some(entry =\u003e !entry.heading)) {\n      if (showErrors) {\n        result.textContent = \"기업명 위치를 확인해야 합니다.\";\n      }\n      return false;\n    }\n\n    const targets = entries.map(entry =\u003e entry.target);\n    const parent = targets[0].parentElement;\n\n    const canSort =\n      new Set(targets).size === targets.length \u0026\u0026\n      targets.every(target =\u003e target.parentElement === parent);\n\n    let sorted = false;\n\n    if (canSort) {\n      const view = parent.ownerDocument.defaultView;\n      const display = view.getComputedStyle(parent).display;\n\n      if (display.includes(\"flex\") || display.includes(\"grid\")) {\n        [...entries]\n          .sort((a, b) =\u003e\n            collator.compare(\n              a.heading.textContent.trim(),\n              b.heading.textContent.trim()\n            )\n          )\n          .forEach((entry, index) =\u003e {\n            entry.target.style.setProperty(\n              \"order\", String(index), \"important\"\n            );\n          });\n\n        sorted = true;\n      }\n    }\n\n    const query = normalize(input.value);\n    let count = 0;\n\n    entries.forEach(({ target, heading }) =\u003e {\n      if (!originalDisplays.has(target)) {\n        originalDisplays.set(target, {\n          value: target.style.getPropertyValue(\"display\"),\n          priority: target.style.getPropertyPriority(\"display\")\n        });\n      }\n\n      const matches =\n        !query || normalize(heading.textContent).includes(query);\n\n      if (matches) {\n        const original = originalDisplays.get(target);\n\n        if (original.value) {\n          target.style.setProperty(\n            \"display\", original.value, original.priority\n          );\n        } else {\n          target.style.removeProperty(\"display\");\n        }\n\n        count++;\n      } else {\n        target.style.setProperty(\"display\", \"none\", \"important\");\n      }\n    });\n\n    const message = query\n      ? count\n        ? \"검색 결과 \" + count + \"개 기업\"\n        : \"검색 결과가 없습니다.\"\n      : \"전체 \" + count + \"개 기업\";\n\n    result.textContent = message + (\n      sorted\n        ? \" · 가나다순\"\n        : \" · 검색 적용됨 / 정렬 구조 확인 필요\"\n    );\n\n    return true;\n  }\n\n  form.addEventListener(\"submit\", event =\u003e {\n    event.preventDefault();\n    update(true);\n  });\n\n  input.addEventListener(\"input\", () =\u003e {\n    if (!input.value) update(true);\n  });\n\n  /* 처음 표시될 때 최대 5회만 확인 */\n  let attempts = 0;\n\n  function initialize() {\n    attempts++;\n\n    if (!update(attempts === 5) \u0026\u0026 attempts \u003c 5) {\n      setTimeout(initialize, 1000);\n    }\n  }\n\n  initialize();\n})();\n\u003c/script\u003e"},{"key":"setting_divider","type":"SETTING-DIVIDER","value":""},{"key":"desktop_full_width","type":"CHECKBOX","value":"false"},{"key":"mobile_full_width","type":"CHECKBOX","value":"false"},{"key":"section_background_color","type":"COLOR-ALLOW-EMPTY","value":"#fafafa"},{"key":"padding_top","type":"RANGE-PX-0-240","value":"24"},{"key":"padding_bottom","type":"RANGE-PX-0-240","value":"0"},{"key":"transition","type":"TRANSITION","value":"none"}],"customCss":"","sectionType":"section-code"},{"ver":1,"path":"offline-index","uuid":"id-2f1bba1b-7547-46cc-9a7e-225b73b4b6e2","blocks":[],"disabled":false,"settings":[{"key":"section_code","type":"CODE-EDITOR-HTML","value":"\u003cscript\u003e\n/* 카드 업종 칸의 \"#태그\"를 배지로 표시 (메인과 같은 모양)\n   사용 태그: #상담 #면접 #온라인\n   예) HR마케팅 #상담 #면접\n   PC: 카드 우측 상단 / 모바일(MOBILE_MAX 이하): 업종 아래 한 줄\n   - 빌더 편집 화면에서는 동작하지 않음. 실제 사이트에서 확인할 것. */\n(function () {\n  var doc = document;\n  try { if (window.parent \u0026\u0026 window.parent !== window \u0026\u0026 window.parent.document) doc = window.parent.document; } catch (e) {}\n  var win = doc.defaultView || window;\n\n  var TAG_INSET = 10;\n  var MOBILE_MAX = 767;\n  var TAG_COLORS = { \"상담\": \"#4cae7c\", \"면접\": \"#4b8fd8\", \"온라인\": \"#6f7985\" };\n  var TAG_DEFAULT = \"#6f7985\";\n\n  function ensureStyle() {\n    if (doc.getElementById(\"sync-tag-style\")) return;\n    var st = doc.createElement(\"style\"); st.id = \"sync-tag-style\";\n    st.textContent =\n      \".sync-tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;line-height:17px;font-weight:600;color:#fff;white-space:nowrap}\" +\n      \".sync-tags{position:absolute;top:\" + TAG_INSET + \"px;right:\" + TAG_INSET + \"px;z-index:5;display:flex;gap:4px;pointer-events:none}\" +\n      \".sync-tags-below{display:none;flex-wrap:wrap;gap:4px;margin-top:6px}\" +\n      \"@media (max-width:\" + MOBILE_MAX + \"px){.sync-tags{display:none}.sync-tags-below{display:flex}}\";\n    doc.head.appendChild(st);\n  }\n  function esc(s) { return String(s).replace(/[\u0026\u003c\u003e\"]/g, function (c) { return { \"\u0026\": \"\u0026amp;\", \"\u003c\": \"\u0026lt;\", \"\u003e\": \"\u0026gt;\", '\"': \"\u0026quot;\" }[c]; }); }\n  function splitBody(html) {\n    var text = String(html || \"\").replace(/\u003c[^\u003e]+\u003e/g, \" \").replace(/\u0026nbsp;/g, \" \").replace(/\\s+/g, \" \").trim();\n    var tags = [];\n    text = text.replace(/#([^\\s#]+)/g, function (_, t) { tags.push(t); return \"\"; }).replace(/\\s+/g, \" \").trim();\n    return { text: text, tags: tags };\n  }\n  function tagHtml(tags) {\n    return tags.map(function (t) {\n      var color = TAG_COLORS[t.replace(/\\s+/g, \"\")] || TAG_DEFAULT;\n      return '\u003cspan class=\"sync-tag\" style=\"background:' + color + '\"\u003e' + esc(t) + \"\u003c/span\u003e\";\n    }).join(\"\");\n  }\n  function findHost(card) {\n    var d = card.firstElementChild;\n    for (var i = 0; d \u0026\u0026 i \u003c 6; i++, d = d.firstElementChild) {\n      var cs = win.getComputedStyle(d);\n      if (cs.backgroundColor !== \"rgba(0, 0, 0, 0)\" || cs.boxShadow !== \"none\") return d;\n    }\n    return card;\n  }\n\n  function apply() {\n    var cards = doc.querySelectorAll(\".block-card-view-column\");\n    if (!cards.length) return false;\n    ensureStyle();\n    cards.forEach(function (card) {\n      var b = card.querySelector(\".card-view-column-block-body\");\n      if (!b) return;\n      if (!card.getAttribute(\"data-body-raw\")) {\n        if (b.textContent.indexOf(\"#\") \u003c 0) return;          /* 태그 없는 카드는 건드리지 않음 */\n        card.setAttribute(\"data-body-raw\", b.innerHTML);     /* 원문 보관(재렌더용) */\n      }\n      var r = splitBody(card.getAttribute(\"data-body-raw\"));\n      var bodyHtml = \"\u003cp\u003e\" + esc(r.text) + \"\u003c/p\u003e\";\n      if (b.innerHTML !== bodyHtml) b.innerHTML = bodyHtml;\n      var th = tagHtml(r.tags);\n\n      var wrap = card.querySelector(\".sync-tags\");\n      if (!wrap) {\n        var host = findHost(card);\n        if (win.getComputedStyle(host).position === \"static\") host.style.position = \"relative\";\n        wrap = doc.createElement(\"div\"); wrap.className = \"sync-tags\"; host.appendChild(wrap);\n      }\n      if (wrap.innerHTML !== th) wrap.innerHTML = th;\n\n      var below = card.querySelector(\".sync-tags-below\");\n      if (!below) {\n        below = doc.createElement(\"div\"); below.className = \"sync-tags-below\";\n        b.parentNode.insertBefore(below, b.nextSibling);\n      }\n      if (below.innerHTML !== th) below.innerHTML = th;\n    });\n    return true;\n  }\n\n  var tries = 0;\n  function run() { tries++; if (!apply() \u0026\u0026 tries \u003c 20) setTimeout(run, 500); }\n  function start() {\n    run();\n    var root = doc.body || doc.documentElement; if (!root) return;\n    var pending;\n    new MutationObserver(function () { clearTimeout(pending); pending = setTimeout(apply, 300); }).observe(root, { childList: true, subtree: true });\n  }\n  if (document.readyState === \"loading\") document.addEventListener(\"DOMContentLoaded\", start); else start();\n})();\n\u003c/script\u003e"},{"key":"setting_divider","type":"SETTING-DIVIDER","value":""},{"key":"desktop_full_width","type":"CHECKBOX","value":"false"},{"key":"mobile_full_width","type":"CHECKBOX","value":"false"},{"key":"section_background_color","type":"COLOR-ALLOW-EMPTY","value":""},{"key":"padding_top","type":"RANGE-PX-0-240","value":"0"},{"key":"padding_bottom","type":"RANGE-PX-0-240","value":"0"},{"key":"transition","type":"TRANSITIO t\n      id=\"fair-search-input\"\n      type=\"search\"\n      aria-label=\"기업명 검색\"\n      placeholder=\"기업명을 입력해 주세요\"\n    \u003e\n    \u003cbutton type=\"submit\"\u003e검색\u003c/button\u003e\n  \u003c/form\u003e\n  \u003cp id=\"fair-search-result\" role=\"status\" aria-live=\"polite\"\u003e\u003c/p\u003e\n\u003c/div\u003e\n\n\u003cscript\u003e\n(() =\u003e {\n  const sectionId = \"id-be80857e-e672-41a9-b7a7-fc03d6f0fc94\";\n  const form = document.getElementById(\"fair-search-form\");\n  const input = document.getElementById(\"fair-search-input\");\n  const result = document.getElementById(\"fair-search-result\");\n  const originalDisplays = new WeakMap();\n\n  const normalize = value =\u003e\n    value.normalize(\"NFKC\").replace(/\\s+/g, \"\").toLowerCase();\n\n  const collator = new Intl.Collator(\"ko\", {\n    numeric: true,\n    sensitivity: \"base\"\n  });\n\n  function findSection() {\n    const local = document.getElementById(sectionId);\n    if (local) return local;\n\n    try {\n      return window.parent.document.getElementById(sectionId);\n    } catch {\n      return null;\n    }\n  }\n\n  function update(showErrors) {\n    const section = findSection();\n\n    if (!section) {\n      if (showErrors) {\n        result.textContent = \"기업 목록에 접근할 수 없습니다.\";\n      }\n      return false;\n    }\n\n    const cards = Array.from(\n      section.querySelectorAll(\".block-card-view-column\")\n    );\n\n    if (!cards.length) {\n      if (showErrors) {\n        result.textContent = \"기업 카드 구조를 확인해야 합니다.\";\n      }\n      return false;\n    }\n\n    const entries = cards.map(card =\u003e {\n      const heading = card.querySelector(\"h5, .CareerTypography-h5\");\n      const grid = card.closest(\".CareerGrid-item\");\n\n      return {\n        heading,\n        target: grid \u0026\u0026 section.contains(grid) ? grid : card\n      };\n    });\n\n    if (entries.some(entry =\u003e !entry.heading)) {\n      if (showErrors) {\n        result.textContent = \"기업명 위치를 확인해야 합니다.\";\n      }\n      return false;\n    }\n\n    const targets = entries.map(entry =\u003e entry.target);\n    const parent = targets[0].parentElement;\n    const canSort =\n      new Set(targets).size === targets.length \u0026\u0026\n      targets.every(target =\u003e target.parentElement === parent);\n\n    let sorted = false;\n\n    if (canSort) {\n      const view = parent.ownerDocument.defaultView;\n      const display = view.getComputedStyle(parent).display;\n\n      if (display.includes(\"flex\") || display.includes(\"grid\")) {\n        [...entries]\n          .sort((a, b) =\u003e\n            collator.compare(\n              a.heading.textContent.trim(),\n              b.heading.textContent.trim()\n            )\n          )\n          .forEach((entry, index) =\u003e {\n            entry.target.style.setProperty(\n              \"order\", String(index), \"important\"\n            );\n          });\n\n        sorted = true;\n      }\n    }\n\n    const query = normalize(input.value);\n    let count = 0;\n\n    entries.forEach(({ target, heading }) =\u003e {\n      if (!originalDisplays.has(target)) {\n        originalDisplays.set(target, {\n          value: target.style.getPropertyValue(\"display\"),\n          priority: target.style.getPropertyPriority(\"display\")\n        });\n      }\n\n      const matches =\n        !query || normalize(heading.textContent).includes(query);\n\n      if (matches) {\n        const original = originalDisplays.get(target);\n\n        if (original.value) {\n          target.style.setProperty(\n            \"display\", original.value, original.priority\n          );\n        } else {\n          target.style.removeProperty(\"display\");\n        }\n\n        count++;\n      } else {\n        target.style.setProperty(\"display\", \"none\", \"important\");\n      }\n    });\n\n    const message = query\n      ? count\n        ? \"검색 결과 \" + count + \"개 기업\"\n        : \"검색 결과가 없습니다.\"\n      : \"전체 \" + count + \"개 기업\";\n\n    result.textContent = message + (\n      sorted\n        ? \" · 가나다순\"\n        : \" · 검색 적용됨 / 정렬 구조 확인 필요\"\n    );\n\n    return true;\n  }\n\n  form.addEventListener(\"submit\", event =\u003e {\n    event.preventDefault();\n    update(true);\n  });\n\n  input.addEventListener(\"input\", () =\u003e {\n    if (!input.value) update(true);\n  });\n\n  let attempts = 0;\n\n  function initialize() {\n    attempts++;\n\n    if (!update(attempts === 5) \u0026\u0026 attempts \u003c 5) {\n      setTimeout(initialize, 1000);\n    }\n  }\n\n  initialize();\n})();\n\u003c/script\u003e"},{"key":"setting_divider","type":"SETTING-DIVIDER","value":""},{"key":"desktop_full_width","type":"CHECKBOX","value":"false"},{"key":"mobile_full_width","type":"CHECKBOX","value":"false"},{"key":"section_background_color","type":"COLOR-ALLOW-EMPTY","value":"#fafafa"},{"key":"padding_top","type":"RANGE-PX-0-240","value":"24"},{"key":"padding_bottom","type":"RANGE-PX-0-240","value":"0"},{"key":"transition","type":"TRANSITION","value":"none"}],"customCss":"","sectionType":"section-code"},{"ver":1,"path":"interview-list","uuid":"id-1d19504f-c409-4d3f-8768-544627a8e02e","blocks":[],"disabled":false,"settings":[{"key":"section_code","type":"CODE-EDITOR-HTML","value":"\u003cscript\u003e\n/* 카드 업종 칸의 \"#태그\"를 배지로 표시 (메인과 같은 모양)\n   사용 태그: #상담 #면접 #온라인\n   예) HR마케팅 #상담 #면접\n   PC: 카드 우측 상단 / 모바일(MOBILE_MAX 이하): 업종 아래 한 줄\n   - 빌더 편집 화면에서는 동작하지 않음. 실제 사이트에서 확인할 것. */\n(function () {\n  var doc = document;\n  try { if (window.parent \u0026\u0026 window.parent !== window \u0026\u0026 window.parent.document) doc = window.parent.document; } catch (e) {}\n  var win = doc.defaultView || window;\n\n  var TAG_INSET = 10;\n  var MOBILE_MAX = 767;\n  var TAG_COLORS = { \"상담\": \"#4cae7c\", \"면접\": \"#4b8fd8\", \"온라인\": \"#6f7985\" };\n  var TAG_DEFAULT = \"#6f7985\";\n\n  function ensureStyle() {\n    if (doc.getElementById(\"sync-tag-style\")) return;\n    var st = doc.createElement(\"style\"); st.id = \"sync-tag-style\";\n    st.textContent =\n      \".sync-tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;line-height:17px;font-weight:600;color:#fff;white-space:nowrap}\" +\n      \".sync-tags{position:absolute;top:\" + TAG_INSET + \"px;right:\" + TAG_INSET + \"px;z-index:5;display:flex;gap:4px;pointer-events:none}\" +\n      \".sync-tags-below{display:none;flex-wrap:wrap;gap:4px;margin-top:6px}\" +\n      \"@media (max-width:\" + MOBILE_MAX + \"px){.sync-tags{display:none}.sync-tags-below{display:flex}}\";\n    doc.head.appendChild(st);\n  }\n  function esc(s) { return String(s).replace(/[\u0026\u003c\u003e\"]/g, function (c) { return { \"\u0026\": \"\u0026amp;\", \"\u003c\": \"\u0026lt;\", \"\u003e\": \"\u0026gt;\", '\"': \"\u0026quot;\" }[c]; }); }\n  function splitBody(html) {\n    var text = String(html || \"\").replace(/\u003c[^\u003e]+\u003e/g, \" \").replace(/\u0026nbsp;/g, \" \").replace(/\\s+/g, \" \").trim();\n    var tags = [];\n    text = text.replace(/#([^\\s#]+)/g, function (_, t) { tags.push(t); return \"\"; }).replace(/\\s+/g, \" \").trim();\n    return { text: text, tags: tags };\n  }\n  function tagHtml(tags) {\n    return tags.map(function (t) {\n      var color = TAG_COLORS[t.replace(/\\s+/g, \"\")] || TAG_DEFAULT;\n      return '\u003cspan class=\"sync-tag\" style=\"background:' + color + '\"\u003e' + esc(t) + \"\u003c/span\u003e\";\n    }).join(\"\");\n  }\n  function findHost(card) {\n    var d = card.firstElementChild;\n    for (var i = 0; d \u0026\u0026 i \u003c 6; i++, d = d.firstElementChild) {\n      var cs = win.getComputedStyle(d);\n      if (cs.backgroundColor !== \"rgba(0, 0, 0, 0)\" || cs.boxShadow !== \"none\") return d;\n    }\n    return card;\n  }\n\n  function apply() {\n    var cards = doc.querySelectorAll(\".block-card-view-column\");\n    if (!cards.length) return false;\n    ensureStyle();\n    cards.forEach(function (card) {\n      var b = card.querySelector(\".card-view-column-block-body\");\n      if (!b) return;\n      if (!card.getAttribute(\"data-body-raw\")) {\n        if (b.textContent.indexOf(\"#\") \u003c 0) return;          /* 태그 없는 카드는 건드리지 않음 */\n        card.setAttribute(\"data-body-raw\", b.innerHTML);     /* 원문 보관(재렌더용) */\n      }\n      var r = splitBody(card.getAttribute(\"data-body-raw\"));\n      var bodyHtml = \"\u003cp\u003e\" + esc(r.text) + \"\u003c/p\u003e\";\n      if (b.innerHTML !== bodyHtml) b.innerHTML = bodyHtml;\n      var th = tagHtml(r.tags);\n\n      var wrap = card.querySelector(\".sync-tags\");\n      if (!wrap) {\n        var host = findHost(card);\n        if (win.getComputedStyle(host).position === \"static\") host.style.position = \"relative\";\n        wrap = doc.createElement(\"div\"); wrap.className = \"sync-tags\"; host.appendChild(wrap);\n      }\n      if (wrap.innerHTML !== th) wrap.innerHTML = th;\n\n      var below = card.querySelector(\".sync-tags-below\");\n      if (!below) {\n        below = doc.createElement(\"div\"); below.className = \"sync-tags-below\";\n        b.parentNode.insertBefore(below, b.nextSibling);\n      }\n      if (below.innerHTML !== th) below.innerHTML = th;\n    });\n    return true;\n  }\n\n  var tries = 0;\n  function run() { tries++; if (!apply() \u0026\u0026 tries \u003c 20) setTimeout(run, 500); }\n  function start() {\n    run();\n    var root = doc.body || doc.documentElement; if (!root) return;\n    var pending;\n    new MutationObserver(function () { clearTimeout(pending); pending = setTimeout(apply, 300); }).observe(root, { childList: true, subtree: true });\n  }\n  if (document.readyState === \"loading\") document.addEventListener(\"DOMContentLoaded\", start); else start();\n})();\n\u003c/script\u003e"},{"key":"setting_divider","type":"SETTING-DIVIDER","value":""},{"key":"desktop_full_width","type":"CHECKBOX","value":"false"},{"key":"mobile_full_width","type":"CHECKBOX","value":"false"},{"key":"section_background_color","type":"COLOR-ALLOW-EMPTY","value":""},{"key":"padding_ lt = document.getElementById(\"fair-search-result\");\n  const originalDisplays = new WeakMap();\n\n  const normalize = value =\u003e\n    value.normalize(\"NFKC\").replace(/\\s+/g, \"\").toLowerCase();\n\n  const collator = new Intl.Collator(\"ko\", {\n    numeric: true,\n    sensitivity: \"base\"\n  });\n\n  function findSection() {\n    const local = document.getElementById(sectionId);\n    if (local) return local;\n\n    try {\n      return window.parent.document.getElementById(sectionId);\n    } catch {\n      return null;\n    }\n  }\n\n  function update(showErrors) {\n    const section = findSection();\n\n    if (!section) {\n      if (showErrors) {\n        result.textContent = \"기업 목록에 접근할 수 없습니다.\";\n      }\n      return false;\n    }\n\n    const cards = Array.from(\n      section.querySelectorAll(\".block-card-view-column\")\n    );\n\n    if (!cards.length) {\n      if (showErrors) {\n        result.textContent = \"기업 카드 구조를 확인해야 합니다.\";\n      }\n      return false;\n    }\n\n    const entries = cards.map(card =\u003e {\n      const heading = card.querySelector(\"h5, .CareerTypography-h5\");\n      const grid = card.closest(\".CareerGrid-item\");\n\n      return {\n        heading,\n        target: grid \u0026\u0026 section.contains(grid) ? grid : card\n      };\n    });\n\n    if (entries.some(entry =\u003e !entry.heading)) {\n      if (showErrors) {\n        result.textContent = \"기업명 위치를 확인해야 합니다.\";\n      }\n      return false;\n    }\n\n    const targets = entries.map(entry =\u003e entry.target);\n    const parent = targets[0].parentElement;\n    const canSort =\n      new Set(targets).size === targets.length \u0026\u0026\n      targets.every(target =\u003e target.parentElement === parent);\n\n    let sorted = false;\n\n    if (canSort) {\n      const view = parent.ownerDocument.defaultView;\n      const display = view.getComputedStyle(parent).display;\n\n      if (display.includes(\"flex\") || display.includes(\"grid\")) {\n        [...entries]\n          .sort((a, b) =\u003e\n            collator.compare(\n              a.heading.textContent.trim(),\n              b.heading.textContent.trim()\n            )\n          )\n          .forEach((entry, index) =\u003e {\n            entry.target.style.setProperty(\n              \"order\", String(index), \"important\"\n            );\n          });\n\n        sorted = true;\n      }\n    }\n\n    const query = normalize(input.value);\n    let count = 0;\n\n    entries.forEach(({ target, heading }) =\u003e {\n      if (!originalDisplays.has(target)) {\n        originalDisplays.set(target, {\n          value: target.style.getPropertyValue(\"display\"),\n          priority: target.style.getPropertyPriority(\"display\")\n        });\n      }\n\n      const matches =\n        !query || normalize(heading.textContent).includes(query);\n\n      if (matches) {\n        const original = originalDisplays.get(target);\n\n        if (original.value) {\n          target.style.setProperty(\n            \"display\", original.value, original.priority\n          );\n        } else {\n          target.style.removeProperty(\"display\");\n        }\n\n        count++;\n      } else {\n        target.style.setProperty(\"display\", \"none\", \"important\");\n      }\n    });\n\n    const message = query\n      ? count\n        ? \"검색 결과 \" + count + \"개 기업\"\n        : \"검색 결과가 없습니다.\"\n      : \"전체 \" + count + \"개 기업\";\n\n    result.textContent = message + (\n      sorted\n        ? \" · 가나다순\"\n        : \" · 검색 적용됨 / 정렬 구조 확인 필요\"\n    );\n\n    return true;\n  }\n\n  form.addEventListener(\"submit\", event =\u003e {\n    event.preventDefault();\n    update(true);\n  });\n\n  input.addEventListener(\"input\", () =\u003e {\n    if (!input.value) update(true);\n  });\n\n  let attempts = 0;\n\n  function initialize() {\n    attempts++;\n\n    if (!update(attempts === 5) \u0026\u0026 attempts \u003c 5) {\n      setTimeout(initialize, 1000);\n    }\n  }\n\n  initialize();\n})();\n\u003c/script\u003e"},{"key":"setting_divider","type":"SETTING-DIVIDER","value":""},{"key":"desktop_full_width","type":"CHECKBOX","value":"false"},{"key":"mobile_full_width","type":"CHECKBOX","value":"false"},{"key":"section_background_color","type":"COLOR-ALLOW-EMPTY","value":"#fafafa"},{"key":"padding_top","type":"RANGE-PX-0-240","value":"24"},{"key":"padding_bottom","type":"RANGE-PX-0-240","value":"0"},{"key":"transition","type":"TRANSITION","value":"none"}],"customCss":"","sectionType":"section-code"},{"ver":1,"path":"online-index","uuid":"id-f3eec2ef-d008-494f-b149-01523f92299f","blocks":[],"disabled":false,"settings":[{"key":"section_code","type":"CODE-EDITOR-HTML","value":"\u003cscript\u003e\n/* 카드 업종 칸의 \"#태그\"를 배지로 표시 (메인과 같은 모양)\n   사용 태그: #상담 #면접 #온라인\n   예) HR마케팅 #상담 #면접\n   PC: 카드 우측 상단 / 모바일(MOBILE_MAX 이하): 업종 아래 한 줄\n   - 빌더 편집 화면에서는 동작하지 않음. 실제 사이트에서 확인할 것. */\n(function () {\n  var doc = document;\n  try { if (window.parent \u0026\u0026 window.parent !== window \u0026\u0026 window.parent.document) doc = window.parent.document; } catch (e) {}\n  var win = doc.defaultView || window;\n\n  var TAG_INSET = 10;\n  var MOBILE_MAX = 767;\n  var TAG_COLORS = { \"상담\": \"#4cae7c\", \"면접\": \"#4b8fd8\", \"온라인\": \"#6f7985\" };\n  var TAG_DEFAULT = \"#6f7985\";\n\n  function ensureStyle() {\n    if (doc.getElementById(\"sync-tag-style\")) return;\n    var st = doc.createElement(\"style\"); st.id = \"sync-tag-style\";\n    st.textContent =\n      \".sync-tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;line-height:17px;font-weight:600;color:#fff;white-space:nowrap}\" +\n      \".sync-tags{position:absolute;top:\" + TAG_INSET + \"px;right:\" + TAG_INSET + \"px;z-index:5;display:flex;gap:4px;pointer-events:none}\" +\n      \".sync-tags-below{display:none;flex-wrap:wrap;gap:4px;margin-top:6px}\" +\n      \"@media (max-width:\" + MOBILE_MAX + \"px){.sync-tags{display:none}.sync-tags-below{display:flex}}\";\n    doc.head.appendChild(st);\n  }\n  function esc(s) { return String(s).replace(/[\u0026\u003c\u003e\"]/g, function (c) { return { \"\u0026\": \"\u0026amp;\", \"\u003c\": \"\u0026lt;\", \"\u003e\": \"\u0026gt;\", '\"': \"\u0026quot;\" }[c]; }); }\n  function splitBody(html) {\n    var text = String(html || \"\").replace(/\u003c[^\u003e]+\u003e/g, \" \").replace(/\u0026nbsp;/g, \" \").replace(/\\s+/g, \" \").trim();\n    var tags = [];\n    text = text.replace(/#([^\\s#]+)/g, function (_, t) { tags.push(t); return \"\"; }).replace(/\\s+/g, \" \").trim();\n    return { text: text, tags: tags };\n  }\n  function tagHtml(tags) {\n    return tags.map(function (t) {\n      var color = TAG_COLORS[t.replace(/\\s+/g, \"\")] || TAG_DEFAULT;\n      return '\u003cspan class=\"sync-tag\" style=\"background:' + color + '\"\u003e' + esc(t) + \"\u003c/span\u003e\";\n    }).join(\"\");\n  }\n  function findHost(card) {\n    var d = card.firstElementChild;\n    for (var i = 0; d \u0026\u0026 i \u003c 6; i++, d = d.firstElementChild) {\n      var cs = win.getComputedStyle(d);\n      if (cs.backgroundColor !== \"rgba(0, 0, 0, 0)\" || cs.boxShadow !== \"none\") return d;\n    }\n    return card;\n  }\n\n  function apply() {\n    var cards = doc.querySelectorAll(\".block-card-view-column\");\n    if (!cards.length) return false;\n    ensureStyle();\n    cards.forEach(function (card) {\n      var b = card.querySelector(\".card-view-column-block-body\");\n      if (!b) return;\n      if (!card.getAttribute(\"data-body-raw\")) {\n        if (b.textContent.indexOf(\"#\") \u003c 0) return;          /* 태그 없는 카드는 건드리지 않음 */\n        card.setAttribute(\"data-body-raw\", b.innerHTML);     /* 원문 보관(재렌더용) */\n      }\n      var r = splitBody(card.getAttribute(\"data-body-raw\"));\n      var bodyHtml = \"\u003cp\u003e\" + esc(r.text) + \"\u003c/p\u003e\";\n      if (b.innerHTML !== bodyHtml) b.innerHTML = bodyHtml;\n      var th = tagHtml(r.tags);\n\n      var wrap = card.querySelector(\".sync-tags\");\n      if (!wrap) {\n        var host = findHost(card);\n        if (win.getComputedStyle(host).position === \"static\") host.style.position = \"relative\";\n        wrap = doc.createElement(\"div\"); wrap.className = \"sync-tags\"; host.appendChild(wrap);\n      }\n      if (wrap.innerHTML !== th) wrap.innerHTML = th;\n\n      var below = card.querySelector(\".sync-tags-below\");\n      if (!below) {\n        below = doc.createElement(\"div\"); below.className = \"sync-tags-below\";\n        b.parentNode.insertBefore(below, b.nextSibling);\n      }\n      if (below.innerHTML !== th) below.innerHTML = th;\n    });\n    return true;\n  }\n\n  var tries = 0;\n  function run() { tries++; if (!apply() \u0026\u0026 tries \u003c 20) setTimeout(run, 500); }\n  function start() {\n    run();\n    var root = doc.body || doc.documentElement; if (!root) return;\n    var pending;\n    new MutationObserver(function () { clearTimeout(pending); pending = setTimeout(apply, 300); }).observe(root, { childList: true, subtree: true });\n  }\n  if (document.readyState === \"loading\") document.addEventListener(\"DOMContentLoaded\", start); else start();\n})();\n\u003c/script\u003e"},{"key":"setting_divider","type":"SETTING-DIVIDER","value":""},{"key":"desktop_full_width","type":"CHECKBOX","value":"false"},{"key":"mobile_full_width","type":"CHECKBOX","value":"false"},{"key":"section_background_color","type":"COLOR-ALLOW-EMPTY","value":""},{"key":"padding_top","type":"RANGE-PX-0-240","value":"0"},{"key":"padding_bottom","type":"RANGE-PX-0-240","value":"0"},{"key":"transition","type":"TRANSITION","value":"none"}],"customCss":"","sectionType":"section-code"},{"ver":3,"path":"","uuid":"id-e6249040-ba1b-4ec8-b36b-bbbc623999bd","blocks":[{"ver":1,"path":"","uuid":"id-e26a099f-171f-4070-8752-02fa00d89692","disabled":false,"settings":[{"key":"image_url","type":"IMAGE-LIBRARY","value":"https://img.inhr.co.kr/static/careerlink/DSGN/261113124533359me8.png"},{"key":"image_click","type":"CLICK","value":"https://www.jobkorea.co.kr/ _align","type":"BOX-ALIGN-TOP-BOTTOM","value":"top"},{"key":"mobile_contents_align_x","type":"LAYOUT-ALIGN-X","value":"start"},{"key":"section_background_color","type":"COLOR-ALLOW-EMPTY","value":""},{"key":"padding_top","type":"RANGE-PX-0-240","value":"24"},{"key":"padding_bottom","type":"RANGE-PX-0-240","value":"0"},{"key":"transition","type":"TRANSITION","value":"none"}],"customCss":"/* 버튼과 텍스트 사이 간격 */\n.block-button + .block-rich-text {\n  margin-top: -10px !important;\n}\n\n/* 텍스트 자체의 위아래 여백 제거 */\n.block-rich-text h6,\n.block-rich-text p {\n  margin-top: 0 !important;\n  margin-bottom: 0 !important;\n}\n","sectionType":"section-image-with-text"},{"ver":1,"path":"","uuid":"id-647e81fc-be18-43ef-b788-b853efbebfbb","blocks":[{"ver":1,"path":"","uuid":"id-f33ef36f-0924-43a8-8442-79cf99c54e33","disabled":false,"settings":[{"key":"question_text","type":"RICHTEXT","value":"\u003cp\u003e\u003cstrong style=\"color: rgb(17, 87, 222);\"\u003e1. AI 활용 및 결과물 권리 기준 \u003c/strong\u003e\u003c/p\u003e"},{"key":"answer_text","type":"RICHTEXT","value":"\u003cul\u003e\u003cli\u003e생성형 AI, 오픈소스, 템플릿, 외부 API·서비스 등을 자유롭게 활용할 수 있음. 주요 활용 내역은 과제 제출서의 「AI 활용내역」에, 상세 출처·링크·라이선스 및 이용 조건은 프로젝트 소개서 지정 별첨의 「활용한 외부 자원·출처」 표에 기재해야 함. 기재 예외 등 세부 사항은 「\u003cu\u003eAI 활용 및 출처 표기 기준\u003c/u\u003e」에 따름.\u003c/li\u003e\u003cli\u003e주관기관은 별도 데이터셋을 제공하지 않음.\u003c/li\u003e\u003cli\u003e외부 데이터, 이미지, 음원, 오픈소스, API 및 기타 제3자 저작물은 적법한 이용 권한을 확보해야 하며, 필요한 경우 출처 및 라이선스를 명확히 표기해야 함.\u003c/li\u003e\u003cli\u003e개인정보 또는 민감정보를 처리하는 경우 관련 법령과 이용 조건을 준수해야 하며, 실제 개인정보가 불필요한 경우 가상·샘플 데이터를 활용함. 다만, 동의 여부와 관계없이 외부 AI 서비스(API 포함)에 실제 개인정보·민감정보를 입력하거나 학습·시연 용도로 전송하는 행위는 금지함. 세부 사항은 「\u003cu\u003eAI 활용 및 출처 표기 기준\u003c/u\u003e」 제7조에 따름.\u003c/li\u003e\u003cli\u003e제출 결과물에 대한 저작권과 지식재산권은 원칙적으로 참가팀에 귀속됨.\u003c/li\u003e\u003cli\u003e주관기관은 해커톤 운영 및 성과 확산을 위해 프로젝트명, 소개자료 및 결과물 화면 등 제출 결과물 일부를 행사 홈페이지·홍보자료·결과보고서·보도자료 등에 비영리 목적으로 활용할 수 있음. 식별 가능한 참가자의 모습·음성 등 촬영물의 외부 홍보 활용은 해당 참가자에게 별도로 안내하고 확인받은 동의 범위에 따름.\u003c/li\u003e\u003c/ul\u003e"},{"key":"filter_apply_list","type":"TEXT","value":"전체,채용"}],"blockType":"block-accordion-column","customCss":""},{"ver":1,"path":"","uuid":"id-061f0b75-7ca4-40c6-a774-9e357238c1d7","disabled":false,"settings":[{"key":"question_text","type":"RICHTEXT","value":"\u003cp\u003e\u003cstrong style=\"color: rgb(17, 87, 222);\"\u003e2. 기존 개발물 및 사전 개발 내역 활용 기준\u003c/strong\u003e\u003c/p\u003e"},{"key":"answer_text","type":"RICHTEXT","value":"\u003cul\u003e\u003cli\u003e기존 프로젝트를 실질적 변경 없이 제출하는 행위는 인정하지 않음.\u003c/li\u003e\u003cli\u003e타 공모전·대회에 출품했거나 수상한 결과물과 동일하거나 실질적으로 유사한 결과물은 제출할 수 없음. 수정·고도화한 경우와 미수상·출품 철회 이력이 있는 경우도 포함함.\u003c/li\u003e\u003cli\u003e세부 기준은 「\u003cu\u003eAI 활용 및 출처 표기 기준\u003c/u\u003e」 제6조에 따름.\u003c/li\u003e\u003c/ul\u003e"},{"key":"filter_apply_list","type":"TEXT","value":"전체,채용"}],"blockType":"block-accordion-column","customCss":""},{"ver":1,"path":"","uuid":"id-7553fa96-6478-427a-97c5-3e8cb21e340f","disabled":false,"settings":[{"key":"question_text","type":"RICHTEXT","value":"\u003cp\u003e\u003cstrong style=\"color: rgb(17, 87, 222);\"\u003e3. 유의사항\u003c/strong\u003e\u003c/p\u003e"},{"key":"answer_text","type":"RICHTEXT","value":"\u003cul\u003e\u003cli\u003e모든 제출물은 기한 내 제출해야 하며, 마감 후 신규 제출 및 평가 내용 변경은 불가함. 참가 신청 시점과 관계없이 모든 팀의 제출 마감은 2026. 11. 23.(월) 17:00로 동일함. 제출본의 동작 유지를 위한 접속 복구·인증정보 교체·실행 환경 복구는 「\u003cu\u003eAI 활용 및 출처 표기 기준\u003c/u\u003e」 제6조에 따름.\u003c/li\u003e\u003cli\u003e운영사무국은 결과물 접수 과정에서 제출자료 누락 여부, 프로토타입 접근·실행 가능 여부, 동일 팀의 복수 제출 시 최종본 등 기본 행정 사항을 확인함.\u003c/li\u003e\u003cli\u003e고의적 허위 기재·은폐, 표절, 제3자 결과물 도용 및 금지된 타 공모전·대회 출품·수상작 제출은 심사에서 제외하며, 수상 이후 확인되면 수상을 취소하고 상금·상장을 반환해야 함.\u003c/li\u003e\u003cli\u003e저작권·라이선스·개인정보 침해 등 그 밖의 위반은 중대성에 따라 보완 요청, 심사 제외 또는 수상 취소 등의 조치를 할 수 있음. 수상 취소 시 지급받은 상금과 상장을 반환해야 함.\u003c/li\u003e\u003cli\u003e위반의 고의성·중대성 및 소명 내용을 검토하여, 향후 3년간 대한상공회의소가 주관하는 행사 참가 제한을 포함한 조치를 주관기관이 최종 결정함. 위반 여부 및 구체적 조치는 「AI 활용 및 출처 표기 기준」 제8조에 따름.\u003c/li\u003e\u003cli\u003e본선 진출팀 선정 결과 공지 후, 2026. 12. 1.(화) 11:00까지 참석 여부를 회신해야 함. 기한 내 미회신하거나 참가를 포기하면 본선 진출이 취소되고 예비팀에 기회가 부여될 수 있음.\u003c/li\u003e\u003cli\u003e본선 참가 확정 후 불가피한 사유로 참가가 어렵거나 일부 팀원이 변경·불참하는 경우 운영사무국에 사전 통보해야 하며, 운영사무국이 참가 자격 충족 여부를 확인하여 본선 참가 가능 여부를 결정함.\u003c/li\u003e\u003c/ul\u003e"},{"key":"filter_apply_list","type":"TEXT","value":"전체,채용"}],"blockType":"block-accordion-column","customCss":""},{"ver":1,"path":"","uuid":"id-a766d2ba-bac8-46df-b809-0722f4115ab5","disabled":false,"settings":[{"key":"question_text","type":"RICHTEXT","value":"\u003cp\u003e\u003cstrong\u003e4. 참고자료\u003c/strong\u003e\u003c/p\u003e"},{"key":"answer_text","type":"RICHTEXT","value":"\u003cp\u003e참가 신청 및 결과물 제출 전 아래 자료를 확인해야 함. 프로젝트 소개서는 제공된 양식을 활용하여 작성함.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"color: rgb(0, 0, 0);\"\u003e(첨부1) \u003c/span\u003e\u003ca href=\"https://drive.google.com/file/d/10w_EV3uv6lMtKyJMqNdANWlW3acgEssM/view?usp=drive_link\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(0, 0, 0);\"\u003eAI 해커톤_대회 안내문\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"color: rgb(0, 0, 0);\"\u003e(첨부2) \u003c/span\u003e\u003ca href=\"https://drive.google.com/file/d/15gESCgdavnFcTF9xTV_3R2nZyhGbgC-P/view?usp=drive_link\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(0, 0, 0);\"\u003eAI해커톤_프로젝트소개서_양식\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"color: rgb(0, 0, 0);\"\u003e(첨부3) \u003c/span\u003e\u003ca href=\"https://drive.google.com/file/d/1PPCIMds1RBXces430OeGF2D7mQWkrdyj/view?usp=drive_link\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(0, 0, 0);\"\u003eAI 해커톤_AI 활용 및 출처 표기 기준\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"color: rgb(0, 0, 0);\"\u003e(첨부4) \u003c/span\u003e\u003ca href=\"https://drive.google.com/file/d/1oIm8tw7tXtPihtxrvdPc0QJvHlWxM5OF/view?usp=sharing\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(0, 0, 0);\"\u003eAI 해커톤_참가자 동의 안내\u003c/a\u003e\u0 "TRANSITION-BACKGROUND","value":"none"},{"key":"transition_block","type":"TRANSITION","value":"none"}],"customCss":"","sectionType":"section-jobs"}],"seoTitle":"대한상공회의소ㅣCAREER FAIRㅣ채용공고","pageBackgroundColor":"","pageBackgroundImageUrl":"","pageBackgroundImageUrlMobile":""}],"popup":[{"ver":1,"path":"Terms-of-use","uuid":"id-d8305f3d-1aad-4a3d-ae52-12b4b916e07b","blocks":[{"ver":1,"path":"","uuid":"id-56d3d305-bd8d-4671-b3fd-c5c9609c48ac","disabled":false,"settings":[{"key":"text","type":"RICHTEXT","value":"\u003cp\u003e제1조(목적)\u003c/p\u003e\u003cp\u003e이 약관은 대한상공회의소(이하 “운영자”)가 운영하는 「2026 대한민국 청년 CAREER FAIR」 홈페이지(이하 “홈페이지”)에서 제공하는 서비스의 이용과 관련하여 운영자와 이용자의 권리·의무 및 책임사항, 기타 필요한 사항을 정하는 것을 목적으로 합니다. NHR은 운영자로부터 위탁받은 범위에서 홈페이지 관리 및 행사 운영 업무를 대행합니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e제2조(정의)\u003c/p\u003e\u003cp\u003e① “서비스”란 홈페이지를 통해 제공하는 회원가입, 행사 사전등록, 상담 신청, 프로그램 신청, 참여기업 및 채용정보 안내, 문의 접수 등 관련 서비스를 말합니다.\u003c/p\u003e\u003cp\u003e② “이용자”란 홈페이지에 접속하여 서비스를 이용하는 회원 및 비회원을 말합니다.\u003c/p\u003e\u003cp\u003e③ “회원”이란 이 약관에 동의하고 정해진 가입 절차를 완료하여 계정을 부여받은 자를 말합니다.\u003c/p\u003e\u003cp\u003e④ “사전등록”이란 회원이 행사 참가를 위해 홈페이지에서 별도의 등록 절차를 완료하는 것을 말합니다.\u003c/p\u003e\u003cp\u003e⑤ “상담 신청”이란 회원이 행사 당일 홈페이지를 통해 참여기업 또는 상담 프로그램에 대한 상담을 신청하는 것을 말합니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e제3조(약관의 게시 및 변경)\u003c/p\u003e\u003cp\u003e① 운영자는 이용자가 이 약관을 쉽게 확인할 수 있도록 홈페이지에 게시합니다.\u003c/p\u003e\u003cp\u003e② 운영자는 관계 법령을 위반하지 않는 범위에서 이 약관을 변경할 수 있습니다.\u003c/p\u003e\u003cp\u003e③ 약관을 변경하는 경우 적용일과 변경 사유를 명시하여 적용일 7일 전부터 홈페이지에 공지합니다. 회원에게 불리하거나 중요한 내용을 변경하는 경우에는 적용일 30일 전부터 공지하고, 회원이 등록한 이메일 등으로 개별 안내합니다.\u003c/p\u003e\u003cp\u003e④ 변경된 약관에 동의하지 않는 회원은 회원탈퇴를 요청할 수 있습니다. 운영자는 관계 법령에 따른 절차 없이 회원의 동의를 임의로 간주하지 않습니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e제4조(회원가입)\u003c/p\u003e\u003cp\u003e① 회원가입을 희망하는 이용자는 이 약관에 동의하고 홈페이지에서 정한 절차에 따라 가입을 신청합니다.\u003c/p\u003e\u003cp\u003e② 운영자는 다음 각 호에 해당하는 경우 가입 승낙을 보류하거나 거절할 수 있습니다.\u003c/p\u003e\u003cp\u003e- 타인의 정보를 도용하거나 허위 정보를 입력한 경우\u003c/p\u003e\u003cp\u003e- 필수 정보를 누락하거나 홈페이지에서 안내한 가입 요건을 충족하지 못한 경우\u003c/p\u003e\u003cp\u003e- 서비스 운영을 방해하거나 부정하게 이용할 목적으로 신청한 사실이 확인된 경우\u003c/p\u003e\u003cp\u003e- 그 밖에 관계 법령을 위반하여 가입을 신청한 경우\u003c/p\u003e\u003cp\u003e③ 운영자는 가입 승낙을 보류하거나 거절하는 경우 그 사유를 신청자에게 안내합니다.\u003c/p\u003e\u003cp\u003e④ 회원가입만으로 행사 사전등록이나 상담 신청이 완료되는 것은 아니며, 회원은 각 서비스에서 안내하는 별도의 신청 절차를 진행해야 합니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e제5조(회원정보 및 계정 관리)\u003c/p\u003e\u003cp\u003e① 회원은 가입 및 서비스 신청 시 정확한 정보를 제공해야 하며, 정보가 변경된 경우 홈페이지에서 수정하거나 운영사무국에 알려야 합니다.\u003c/p\u003e\u003cp\u003e② 회원은 자신의 로그인 정보 등 계정 접근 정보를 안전하게 관리하고, 이를 타인에게 양도하거나 대여해서는 안 됩니다.\u003c/p\u003e\u003cp\u003e③ 회원은 계정 도용 또는 무단 사용 사실을 알게 된 경우 지체 없이 운영사무국에 알려야 합니다.\u003c/p\u003e\u003cp\u003e④ 운영자는 계정 도용 등의 신고를 접수한 경우 사실 확인 및 피해 방지를 위해 필요한 조치를 합니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e제6조(서비스의 제공)\u003c/p\u003e\u003cp\u003e① 운영자는 다음 각 호의 서비스를 제공합니다.\u003c/p\u003e\u003cp\u003e- 행사 개요, 일정, 장소 및 이용 방법 안내\u003c/p\u003e\u003cp\u003e- 회원가입 및 회원정보 관리\u003c/p\u003e\u003cp\u003e- 행사 사전등록 및 등록 내역 확인\u003c/p\u003e\u003cp\u003e- 행사 당일 상담 신청 및 신청 관련 안내\u003c/p\u003e\u003cp\u003e- 설명회, 특강 등 프로그램 안내 및 신청\u003c/p\u003e\u003cp\u003e- 참여기업 및 채용 관련 정보 제공\u003c/p\u003e\u003cp\u003e- 공지사항 안내 및 문의 접수\u003c/p\u003e\u003cp\u003e- 그 밖에 행사 운영에 필요한 서비스\u003c/p\u003e\u003cp\u003e② 서비스별 이용 기간, 신청 자격, 정원 및 이용 방법은 홈페이지의 개별 안내에 따릅니다.\u003c/p\u003e\u003cp\u003e③ 행사 안내 등 일부 서비스는 비회원도 이용할 수 있으며, 사전등록 및 상담 신청 등은 회원가입 후 이용할 수 있습니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e제7조(사전등록 및 상담·프로그램 신청)\u003c/p\u003e\u003cp\u003e① 회원은 회원가입 후 별도의 절차에 따라 행사 사전등록을 진행할 수 있습니다.\u003c/p\u003e\u003cp\u003e② 행사 당일 상담 신청의 대상, 접수 시간, 신청 방법 및 진행 방식은 홈페이지와 현장 안내에 따릅니다.\u003c/p\u003e\u003cp\u003e③ 사전등록만으로 개별 상담 또는 프로그램 참여가 확정되는 것은 아닙니다. 상담 및 프로그램은 별도의 신청, 배정 또는 확인 절차가 있을 수 있으며, 운영자는 해당 절차를 사전에 안내합니다.\u003c/p\u003e\u003cp\u003e④ 상담 및 프로그램 참여는 정원, 기업별 운영 상황, 상담 가능 시간 등에 따라 제한될 수 있습니다.\u003c/p\u003e\u003cp\u003e⑤ 회원은 신청한 상담 또는 프로그램에 참여하기 어려운 경우 홈페이지에서 안내하는 방법에 따라 신청을 취소하거나 운영사무국에 알려야 합니다.\u003c/p\u003e\u003cp\u003e⑥ 운영자는 참여기업의 사정이나 현장 운영 상황으로 일정 변경 또는 취소가 필요한 경우 홈페이지, 현장 공지 또는 개별 연락을 통해 안내합니다.\u003c/p\u003e\u003cp\u003e⑦ 타인의 정보를 이용하거나 자동화된 수단으로 부정하게 신청하는 등 정상적인 운영을 방해한 사실이 확인된 경우 운영자는 해당 신청을 취소하거나 이용을 제한할 수 있습니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e제8조(회원탈퇴)\u003c/p\u003e\u003cp\u003e① 회원은 홈페이지에서 안내하는 방법 또는 운영사무국 문의를 통해 언제든지 회원탈퇴를 요청할 수 있으며, 운영자는 관계 법령에 따라 처리합니다.\u003c/p\u003e\u003cp\u003e② 회원탈퇴 시 기존 사전등록 및 상담·프로그램 신청은 취소되며, 해당 신청 내역은 삭제되어 복구할 수 없습니다. 재가입하더라도 기존 신청 내역은 복원되지 않습니다.\u003c/p\u003e\u003cp\u003e③ 운영자는 회원이 탈퇴를 진행하기 전에 신청 취소 및 신청 내역 삭제에 관한 사항을 안내합니다.\u003c/p\u003e\u003cp\u003e④ 탈퇴한 회원의 개인정보는 개인정보 처리방침에 따라 지체 없이 파기합니다. 다만, 관계 법령에 따라 보관해야 하는 정보는 해당 법령에서 정한 기간 동안 별도로 보관한 후 파기합니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e제9조(이용자의 의무 및 이용 제한)\u003c/p\u003e\u003cp\u003e① 이용자는 다음 각 호의 행위를 해서는 안 됩니다.\u003c/p\u003e\u003cp\u003e- 타인의 개인정보를 도용하거나 허위 정보를 등록하는 행위\u003c/p\u003e\u003cp\u003e- 타인의 계정을 무단으로 사용하거나 자신의 계정을 양도·대여하는 행위\u003c/p\u003e\u003cp\u003e- 다른 이용자 또는 제3자의 명예, 저작권 등 권리를 침해하는 행위\u003c/p\u003e\u003cp\u003e- 홈페이지의 정상적인 운영을 방해하거나 시스템에 무단으로 접근하는 행위\u003c/p\u003e\u003cp\u003e- 악성 프로그램을 유포하거나 정보를 부정한 방법으로 수집하는 행위\u003c/p\u003e\u003cp\u003e- 상담 또는 프로그램을 부정하게 신청하거나 다른 이용자의 참여를 방해하는 행위\u003c/p\u003e\u003cp\u003e- 운영자의 사전 동의 없이 서비스를 이용하여 광고 또는 영리 활동을 하는 행위\u003c/p\u003e\u003cp\u003e- 그 밖에 관계 법령 또는 이 약관을 위반하는 행위\u003c/p\u003e\u003cp\u003e② 운영자는 위반 내용과 정도에 따라 신청 취소 또는 계정 이용 제한 등의 조치를 할 수 있습니다.\u003c/p\u003e\u003cp\u003e③ 운영자는 조치의 사유와 내용을 회원에게 안내하고 소명할 기회를 제공합니다. 다만, 긴급한 조치가 필요한 경우 먼저 조치한 후 안내할 수 있습니다.\u003c/p\u003e\u003cp\u003e④ 회원은 운영사무국을 통해 해당 조치에 대한 이의를 제기할 수 있습니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e제10조(운영자의 의무 및 개인정보 보호)\u003c/p\u003e\u003cp\u003e① 운영자는 안정적인 서비스 제공을 위해 합리적인 노력을 기울이며, 이용자의 정당한 의견이나 불만을 검토하고 처리합니다.\u003c/p\u003e\u003cp\u003e② 운영자는 관계 법령에 따라 이용자의 개인정보를 보호합니다.\u003c/p\u003e\u003cp\u003e③ 운영자는 회원가입, 행사 사전등록, 상담 및 프로그램 신청 등 각 단계에서 필요한 개인정보를 수집하는 경우, 수집·이용 목적, 수집 항목, 보유·이용 기간, 동의 거부 권리 및 거부 시 불이익이 있는 경우 그 내용을 안내하고 별도의 동의를 받습니다.\u003c/p\u003e\u003cp\u003e④ 개인정보를 참여기업 등 제3자에게 제공하는 경우에는 해당 신청 단계에서 제공받는 자, 제공 목적, 제공 항목, 보유·이용 기간, 동의 거부 권리 및 거부 시 불이익이 있는 경우 그 내용을 안내하고, 수집·이용 동의와 구분하여 필요한 동의를 받습니다.\u003c/p\u003e\u003cp\u003e⑤ 개인정보 처리 위탁 및 그 밖의 개인정보 처리에 관한 사항은 별도로 게시하는 개인정보 처리방침과 각 단계의 동의 안내에 따릅니다.\u003c/p\u003e\u003cp\u003e⑥ 이 약관에 대한 동의는 개인정보 수집·이용, 제3자 제공 또는 광고성 정보 수신에 대한 동의를 대신하지 않습니다\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e제11조(서비스의 변경·중단 및 통지)\u003c/p\u003e\u003cp\u003e① 운영자는 행사 일정 변경, 시스템 점검, 통신 장애 또는 그 밖의 운영상 필요한 사유로 서비스의 일부를 변경하거나 일시 중단할 수 있습니다.\u003c/p\u003e\u003cp\u003e② 변경 또는 중단이 예정된 경우 사유와 기간을 사전에 공지합니다. 다만, 긴급한 장애 등 사전 공지가 어려운 경우에는 사후에 지체 없이 안내합니다.\u003c/p\u003e\u003cp\u003e③ 행사 종료 후에는 서비스의 전부 또는 일부가 종료될 수 있으며, 운영자는 종료 일정과 신청 내역 확인 등 필요한 후속 절차를 사전에 안내합니다.\u003c/p\u003e\u003cp\u003e④ 운영자는 가입 확인, 사전등록, 상담 신청, 일정 변경 등 서비스 이용에 필요한 사항을 홈페이지, 이메일 또는 문자메시지 등으로 안내할 수 있습니다.\u003c/p\u003e\u003cp\u003e⑤ 영리 목적의 광고성 정보를 전송하는 경우에는 관계 법령에 따라 별도의 수신 동의를 받는 등 필요한 절차를 준수합니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e제12조(저작권 및 제출 자료)\u003c/p\u003e\u003cp\u003e① 홈페이지에 게시된 자료의 저작권은 운영자 또는 해당 권리자에게 있습니다.\u003c/p\u003e\u003cp\u003e② 이용자는 관계 법령에서 허용하거나 권리자의 동의를 받은 경우를 제외하고 홈페이지의 자료를 무단으로 복제·배포·전송하거나 영리 목적으로 이용할 수 없습니다.\u003c/p\u003e\u003cp\u003e③ 회원이 신청 또는 문의 과정에서 제출한 자료의 권리는 해당 회원 또는 원래의 권리자에게 있습니다. 운영자는 서비스 제공과 신청·문의 처리에 필요한 범위에서 해당 자료를 이용하며, 별도의 홍보 등에 활용하려는 경우 필요한 동의를 받습니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e제13조(책임의 범위 및 분쟁 해결)\u003c/p\u003e\u003cp\u003e① 운영자와 이용자는 자신의 귀책사유로 상대방에게 손해를 발생시킨 경우 관계 법령에 따라 책임을 부담합니다.\u003c/p\u003e\u003cp\u003e② 운영자는 참여기업 등이 제공하는 채용정보의 정확성을 높이기 위해 노력하며, 오류를 확인한 경우 정정 등 필요한 조치를 합니다.\u003c/p\u003e\u003cp\u003e③ 채용 여부, 채용 조건 및 근로계약 체결은 해당 기업과 지원자 사이에서 결정됩니다. 회원가입, 사전등록, 상담 또는 프로그램 참여가 채용을 보장하는 것은 아닙니다.\u003c/p\u003e\u003cp\u003e④ 천재지변 등 운영자의 책임 없는 사유로 발생한 서비스 장애에 대해서는 관계 법령에 따라 책임이 제한될 수 있습니다.\u003c/p\u003e\u003cp\u003e⑤ 본 조는 관계 법령에 따라 인정되는 이용자의 권리를 제한하거나 운영자의 책임을 부당하게 면제하는 것으로 해석되지 않습니다.\u003c/p\u003e\u003cp\u003e⑥ 운영자와 이용자는 분쟁이 발생한 경우 상호 협의하여 해결하도록 노력합니다.\u003c/p\u003e\u003cp\u003e⑦ 이 약관은 대한민국 법률에 따라 해석되며, 소송이 제기되는 경우 관할법원은 민사소송법 등 관계 법령에 따릅니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e제14조(운영 주체 및 문의처)\u003c/p\u003e\u003cp\u003e① 홈페이지 운영 주체는 대한상공회의소이며, 운영 대행사는 NHR입니다.\u003c/p\u003e\u003cp\u003e② 서비스 이용 및 이 약관에 관한 문의는 아래 운영사무국으로 접수할 수 있습니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e[2026 대한민국 청년 CAREER FAIR 운영사무국]\u003c/p\u003e\u003cp\u003e- 회사명: NHR\u003c/p\u003e\u003cp\u003e- 사업자등록번호: 161-86-01410\u003c/p\u003e\u003cp\u003e- 전화: 02-6953-6856\u003c/p\u003e\u003cp\u003e- 이메일: korcham.careerfair@gmail.com\u003c/p\u003e\u003cp\u003e- 문의 시간: 10:00~17:00(점심시간 12:00~13:00 제외)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e부칙\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e이 약관은 2026년 11월 2일부터 시행합니다.\u003c/p\u003e"},{"key":"text_size","type":"TEXT-SIZE","value":"h6"},{"key":"text_font","type":"SELECT-FONT","value":"theme"},{"key":"text_color","type":"COLOR","value":"#212121"},{"key":"text_align","type":"TEXT-ALIGN-X","value":"left"},{"key":"setting_divider","type":"SETTING-DIVIDER","value":""},{"key":"padding_top","type":"RANGE-PX-0-80","value":"16"},{"key":"padding_bottom","type":"RANGE-PX-0-80","value":"16"}],"blockType":"block-popup-text","customCss":""}],"disabled":false,"settings":[{"key":"heading","type":"TEXT","value":"2026 대한민국 청년 CAREER FAIR 홈페이지 이용약관"},{"key":"contents_background_color","type":"COLOR","value":"#ffffff"},{"key":"top_bottom_background_color","type":"COLOR","value":"#fafafa"},{"key":"border_color","type":"COLOR-ALLOW-EMPTY","value":""},{"key":"divider_color ==================\n   10. 모든 공고 — 최종 제출 버튼\n   안내 문구 옆 최종 제출 버튼만 변경\n   ============================================================ */\n\n.CareerDialog-paper\n:has(\u003e .final-submit-dialog-notice-text)\n\u003e button.CareerLoadingButton-root\n\u003e span:first-child:not(.CareerTouchRipple-root) {\n  font-size: 0 !important;\n}\n\n.CareerDialog-paper\n:has(\u003e .final-submit-dialog-notice-text)\n\u003e button.CareerLoadingButton-root\n\u003e span:first-child:not(.CareerTouchRipple-root)::after {\n  content: var(--cf-submit-button);\n  font-size: 14px !important;\n}\n\n\n/* ============================================================\n   11. 모든 공고 — 최종 확인 질문\n   ============================================================ */\n\n.CareerDialog-paper[aria-describedby=\"alert-dialog-description\"]\n.CareerStack-root:has(\u003e p \u003e .final-submit-policy-notice)\n\u003e p.CareerTypography-body1:not(.CareerDialogContentText-root) {\n  font-size: 0 !important;\n}\n\n.CareerDialog-paper[aria-describedby=\"alert-dialog-description\"]\n.CareerStack-root:has(\u003e p \u003e .final-submit-policy-notice)\n\u003e p.CareerTypography-body1:not(.CareerDialogContentText-root)::after {\n  content: var(--cf-submit-question);\n  font-size: 16px !important;\n  line-height: 1.6;\n}\n\n\n/* ============================================================\n   12. 모든 공고 — 최종 확인 수정 불가 안내\n   ============================================================ */\n\n.CareerDialog-paper[aria-describedby=\"alert-dialog-description\"]\np.CareerTypography-body2:has(\u003e .final-submit-policy-notice) {\n  font-size: 0 !important;\n}\n\n.CareerDialog-paper[aria-describedby=\"alert-dialog-description\"]\np.CareerTypography-body2:has(\u003e .final-submit-policy-notice)::before {\n  content: var(--cf-submit-description);\n  font-size: 14px !important;\n  line-height: 1.6;\n}\n\n\n/* ============================================================\n   13. 모든 공고 — 최종 확인 개인정보 안내\n   ============================================================ */\n\n.CareerDialog-paper[aria-describedby=\"alert-dialog-description\"]\n.final-submit-policy-notice {\n  display: block !important;\n  margin-top: 16px;\n  font-size: 0 !important;\n  line-height: 1.6;\n}\n\n.CareerDialog-paper[aria-describedby=\"alert-dialog-description\"]\n.final-submit-policy-notice::after {\n  content: \"제출된 내용은 당사의 개인정보 처리방침 기준에 의거하여 관리 및 파기됩니다.\";\n  font-size: 14px !important;\n  line-height: 1.6;\n}\n\n.CareerDialog-paper[aria-describedby=\"alert-dialog-description\"]\n.final-submit-policy-notice \u003e br {\n  display: none;\n}\n\n\n/* ============================================================\n   14. PC 마이페이지 — 신청 현황 제목\n   원래 글자 크기·굵기 유지\n   ============================================================ */\n\n.user-my-page .aplt-layout\n\u003e .CareerStack-root\n\u003e h6.CareerTypography-h6 {\n  position: relative;\n  color: transparent !important;\n}\n\n.user-my-page .aplt-layout\n\u003e .CareerStack-root\n\u003e h6.CareerTypography-h6::after {\n  content: \"신청 현황\";\n  position: absolute;\n  top: 0;\n  left: 0;\n  color: #17212f;\n  font-family: inherit;\n  font-size: inherit;\n  font-weight: inherit;\n  line-height: inherit;\n  letter-spacing: inherit;\n  white-space: nowrap;\n  pointer-events: none;\n}\n\n\n/* ============================================================\n   15. 모바일 마이페이지 — 신청 현황 탭\n   ============================================================ */\n\nbutton.CareerTab-root.tab-aplt-area {\n  position: relative;\n  color: transparent !important;\n}\n\nbutton.CareerTab-root.tab-aplt-area::after {\n  content: \"신청 현황\";\n  position: absolute;\n  inset: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  color: #8b95a1;\n  font-family: inherit;\n  font-size: inherit;\n  font-weight: inherit;\n  line-height: inherit;\n  letter-spacing: inherit;\n  pointer-events: none;\n}\n\nbutton.CareerTab-root.tab-aplt-area[aria-selected=\"true\"]::after {\n  color: var(--career-palette-primary-main, #1557ff);\n}\n\n\n/* ============================================================\n   16. 신청 현황 카드 — 경력·고용형태 숨김\n   ============================================================ */\n\n.user-my-page .aplt-layout .carr-nm,\n.user-my-page .aplt-layout .hire-nm {\n  display: none !important;\n}\n\n\n/* ============================================================\n   17. 신청 현황 카드 — 전형 단계 숨김\n   PC와 모바일 모두 적용\n   ============================================================ */\n\n.user-my-page .aplt-layout\n\u003e .CareerBox-root\n\u003e .CareerGrid-container {\n  display: none !important;\n}\n\n.user-my-page .aplt-layout\n.CareerStack-root.visible-scroll {\n  display: none !important;\n}\n\n\n/* ============================================================\n   18. 신청 현황 카드 — 보기·수정·삭제 버튼 문구\n\n   신청 카드 내부만 적용\n   상단 개인정보 수정하기 버튼은 유지\n   아이콘과 실제 버튼 동작은 유지\n   ============================================================ */\n\n/* 지원서 보기 → 보기 */\n.user-my-page .aplt-layout\nbutton.CareerLoadingButton-root:has(.tabler-icon-report-search)\n\u003e span:not(.CareerButton-startIcon):not(.CareerTouchRipple-root) {\n  font-size: 0 !important;\n}\n\n.user-my-page .aplt-layout\nbutton.CareerLoadingButton-root:has(.tabler-icon-report-search)\n\u003e span:not(.CareerButton-startIcon):not(.CareerTouchRipple-root)::after {\n  content: \"보기\";\n  font-size: 14px;\n  line-height: 1.5;\n}\n\n/* 지원서 수정 → 수정 */\n.user-my-page .aplt-layout\nbutton.CareerLoadingButton-root:has(.tabler-icon-pencil)\n\u003e span:not(.CareerButton-startIcon):not(.CareerTouchRipple-root) {\n  font-size: 0 !important;\n}\n\n.user-my-page .aplt-layout\nbutton.CareerLoadingButton-root:has(.tabler-icon-pencil)\n\u003e span:not(.CareerButton-startIcon):not(.CareerTouchRipple-root)::after {\n  content: \"수정\";\n  font-size: 14px;\n  line-height: 1.5;\n}\n\n/* 지원서 삭제 → 삭제 */\n.user-my-page .aplt-layout\nbutton.aplt-delete-button\n\u003e span:not(.CareerButton-startIcon):not(.CareerTouchRipple-root) {\n  font-size: 0 !important;\n}\n\n.user-my-page .aplt-layout\nbutton.aplt-delete-button\n\u003e span:not(.CareerButton-startIcon):not(.CareerTouchRipple-root)::after {\n  content: \"삭제\";\n  font-size: 14px;\n  line-height: 1.5;\n}\n\n\n/* ============================================================\n   19. 신청 현황 — 빈 내역 안내\n   PC·모바일 모두 신청 내역이 없습니다.\n   ============================================================ */\n\n/* PC */\n.user-my-page .aplt-layout\n\u003e .CareerBox-root\n\u003e p.CareerTypography-body1:only-child {\n  position: relative;\n  color: transparent !important;\n}\n\n.user-my-page .aplt-layout\n\u003e .CareerBox-root\n\u003e p.CareerTypography-body1:only-child::after {\n  content: \"신청 내역이 없습니다.\";\n  position: absolute;\n  top: 0;\n  left: 0;\n  color: #6b7684;\n  font-family: inherit;\n  font-size: inherit;\n  font-weight: inherit;\n  line-height: inherit;\n  letter-spacing: inherit;\n  pointer-events: none;\n}\n\n/* 모바일 */\n#id-tab-ref .aplt-layout\n\u003e p.CareerTypography-body2:only-child {\n  position: relative;\n  color: transparent !important;\n}\n\n#id-tab-ref .aplt-layout\n\u003e p.CareerTypography-body2:only-child::after {\n  content: \"신청 내역이 없습니다.\";\n  position: absolute;\n  top: 0;\n  left: 0;\n  color: #6b7684;\n  font-family: inherit;\n  font-size: inherit;\n  font-weight: inherit;\n  line-height: inherit;\n  letter-spacing: inherit;\n  pointer-events: none;\n}\n\n\n/* ============================================================\n   20. 마이페이지 — 확인창 공통 안내\n   같은 형식의 단순 확인창에 공통 적용\n   ============================================================ */\n\n.CareerDialog-paper[aria-describedby=\"alert-dialog-description\"]\n.CareerDialogContent-root\n\u003e p.CareerDialogContentText-root:not(:has(*)):where(\n  body:has(.user-my-page) *\n) {\n  font-size: 0 !important;\n}\n\n.CareerDialog-paper[aria-describedby=\"alert-dialog-description\"]\n.CareerDialogContent-root\n\u003e p.CareerDialogContentText-root:not(:has(*)):where(\n  body:has(.user-my-page) *\n)::after {\n  content: \"제출된 내용을 삭제하시겠습니까?\\A삭제 후에는 접수 기간 내에 다시 신청/지원할 수 있습니다.\";\n  display: block;\n  white-space: pre-line;\n  font-size: 16px !important;\n  line-height: 1.6;\n}\n\n\n/* ============================================================\n   21. 마이페이지 — 보기 팝업 제목 텍스트 제거\n   닫기 버튼은 유지\n   ============================================================ */\n\n.CareerDialog-paper:has(.resume-APPLY_INFO)\n\u003e .CareerDialogTitle-root\n\u003e .CareerStack-root:where(\n  body:has(.user-my-page) *\n) {\n  color: transparent !important;\n}\n\n.CareerDialog-paper:has(.resume-APPLY_INFO)\n\u003e .CareerDialogTitle-root\n\u003e .CareerStack-root:where(\n  body:has(.user-my-page) *\n)::before {\n  content: none !important;\n}\n\n\n/* ============================================================\n   22. 메인 — 참가기업 롤링 카드 로딩 가림\n\n   메인 카드 동기화 코드가 실제 기업으로 바꾸기 전까지\n   빌더에 넣어둔 자리용 카드(기업명 1, 업종 …)를 가렸다가\n   바뀌는 순간 부드럽게 나타나게 함.\n   - 바뀐 카드에는 코드가 배지 자리(.sync-tags)를 만들므로 그걸 신호로 씀\n   - 코드가 실행되지 않는 경우를 대비해 4초 뒤에는 무조건 표시\n   ============================================================ */\n\n@keyframes cf-sync-reveal {\n  to { opacity: 1; }\n}\n\n.section-card-view .slick-slide .block-card-view-column {\n  transition: opacity 0.25s ease;\n}\n\n.section-card-view .slick-slide .block-card-view-column:not(:has(.sync-tags)) {\n  opacity: 0;\n  animation: cf-sync-reveal 0.3s ease 4s forwards;\n}\n\n/* ============================================================\n   23. 모바일 — 전체 글자·버튼 조금 작게\n\n   사이트 글자 크기가 px로 고정돼 있어 기준 글자 크기 변경으로는 안 줄어듦.\n   대신 글자 블록(제목·본문·카드 문구)과 버튼을 같은 비율로 축소해\n   서로 간 크기 차이는 그대로 유지.\n   - 0.9 = 90% 크기. 더 줄이려면 0.85, 덜 줄이려면 0.95 (두 곳 같이 수정)\n   - 767px 이하(모바일)에서만 적용\n   ============================================================ */\n\n@media (max-width: 767px) {\n  /* 글자 블록 (버튼 안 글자는 버튼에서 같이 줄어드므로 제외 → 두 번 줄지 않음) */\n  .CareerTypography-root:not(.CareerTypography-root .CareerTypography-root):not(.CareerButtonBase-root .CareerTypography-root) {\n    zoom: 0.9;\n  }\n\n  /* 버튼 (로그인·지원하기·더보기·검색 등) — 글씨와 버튼 크기가 함께 줄어듦 */\n  .CareerButtonBase-root:not(.CareerButtonBase-root .CareerButtonBase-root) {\n    zoom: 0.9;\n  }\n}\n\n/* ============================================================\n   24. 메인 참가대상 — 모바일 줄바꿈\n\n   빌더 문구를 두 문단으로 나눠둠:\n     \"KDT · K-뉴딜 훈련생 및 수료생, 취업에 관심 있는 \"\n     \"대한민국 청년 누구나\"\n   - 모바일(767px 이하): [참가대상] 버튼 위, 문구 두 줄 아래\n   - PC(768px 이상): 두 문단을 한 줄로 이어 붙임\n   ※ 섹션 CSS보다 우선 적용되도록 ID를 두 번 겹쳐 씀\n   ============================================================ */\n\n@media (max-width: 767px) {\n  /* 문구를 한 줄 전체 폭으로 → 버튼은 위, 문구는 아래 */\n  #builder-body #id-932fd3ed-1536-451d-a88f-a33bec347a4c#id-932fd3ed-1536-451d-a88f-a33bec347a4c {\n    flex: 0 0 100% !important;\n    width: 100% !important;\n  }\n}\n\n@media (min-width: 768px) {\n  /* PC: 두 문단을 한 줄로, 사이에 띄어쓰기 */\n  #id-932fd3ed-1536-451d-a88f-a33bec347a4c h6 p {\n    display: inline;\n  }\n  #id-932fd3ed-1536-451d-a88f-a33bec347a4c h6 p + p::before {\n    content: \" \";\n  }\n}\n\n/* ============================================================\n   25. 공고 목록·모든 공고 상세 — 왼쪽 필터 영역 전체 숨김\n   Search Jobs · Filter · 참가기업 드롭다운 모두 숨기고\n   공고 목록/본문이 전체 폭을 쓰도록 함\n   - 새 공고가 추가돼도 공고 번호를 등록할 필요 없이 자동 적용\n   ============================================================ */\n\n.user-jobs \u003e .job-filter-layout,\n.user-jobs-detail \u003e .job-filter-layout {\n  display: none !important;\n}\n\n/* ============================================================\n   26. 외부 채용 연결 공고 — 자동 처리\n\n   사용법(관리자 공고 편집): \"상세 내용\" 맨 첫 줄에\n   \"지원하기\"를 쓰고 외부 채용 주소를 링크로 건다.\n\n   그러면 그 공고는 자동으로\n   - 지원직무 선택 + 지원하기 버튼 영역 숨김\n   - 첫 줄 링크를 파란 지원하기 버튼으로 표시\n   (공고 번호·주소를 CSS에 등록할 필요 없음)\n   ※ 첫 줄이 이미지인 일반 공고는 영향 없음\n   ============================================================ */\n\n/* 첫 줄에 링크가 있는 공고: 기존 지원 영역 숨김 */\n.job-detail-layout:has(\n  \u003e div:nth-child(2) \u003e :first-child \u003e a,\n  \u003e div:nth-child(2) \u003e :first-child \u003e :first-child \u003e a\n) .apply-button-area {\n  display: none !important;\n}\n\n/* 첫 줄 링크를 버튼 모양으로 */\n.job-detail-layout \u003e div:nth-child(2) \u003e :first-child:not(:has(img)) \u003e a,\n.job-detail-layout \u003e div:nth-child(2) \u003e :first-child \u003e :first-child:not(:has(img)) \u003e a {\n  display: inline-flex !important;\n  align-items: center;\n  justify-content: center;\n  min-width: 120px;\n  height: 48px;\n  padding: 0 24px;\n  margin: 4px 0 16px;\n  border-radius: 4px;\n  background: var(--career-palette-primary-main, #1557ff);\n  color: #fff !important;\n  font-size: 16px;\n  font-weight: 700;\n  text-decoration: none !important;\n}\n/* ============================================================\n   27. 모든 공고 상세 — 하단 \"← 채용공고\" 버튼 숨김\n   공고 번호와 상관없이 /jobs/공고번호 페이지 전체에 적용\n   ============================================================ */\n\n.job-detail-layout .go-back-button-area {\n  display: none !important;\n}","cmTmplYn":"","imgUrl":""},"custFuncInfList":[{"coNo":"CO202610127236","custFuncGbcd":"03","custFuncNm":"공고별 접수번호","useYn":"N"},{"coNo":"CO202610127236","custFuncGbcd":"01","custFuncNm":"공고별,직무별 관리자","useYn":"N"},{"coNo":"CO202610127236","custFuncGbcd":"02","custFuncNm":"비회원","useYn":"N"},{"coNo":"CO202610127236","custFuncGbcd":"04","custFuncNm":"AI 어시스턴트","useYn":"N"}],"rcrtNo":"RC20261016037797"}}},"__N_SSP":true},"page":"/jobs/[rcrtNo]","query":{"rcrtNo":"RC20261016037797"},"buildId":"NlTM7fsFYOw9U3x7a04Dl","isFallback":false,"dynamicIds":[18349],"gssp":true,"scriptLoader":[]}</script></body></html>
