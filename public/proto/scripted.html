<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마음 시간표 · 대본형 데모</title>
<link rel="stylesheet" href="../styles.css">
<style>
  :root {
    --screen: #ffffff; --bot: #f1f0ec; --bot-ink: #17171a; --me: #17171a; --me-ink: #ffffff;
    --hair: rgba(23,23,26,.08); --frame: #0c0c0d; --muted: #77777c;
  }
  @media (prefers-color-scheme: dark) { :root {
    --screen: #0e0e10; --bot: #1f1f23; --bot-ink: #f1f0ec; --me: #f1f0ec; --me-ink: #17171a;
    --hair: rgba(255,255,255,.08); --frame: #000; --muted: #8f8e8a;
  } }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent-soft); color: var(--ink); }
  body { margin: 0; min-height: 100vh; background: var(--ground); color: var(--ink); font-family: var(--font);
    word-break: keep-all; overflow-wrap: break-word; display: grid; place-items: center; padding: 32px 16px;
    -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* demo control panel (outside the phone) */
  .side { position: fixed; top: 24px; left: 24px; width: 232px; font-size: 12px; color: var(--ink-3); line-height: 1.55; }
  .side strong { display: block; font-size: 13px; color: var(--ink); font-weight: 600; margin-bottom: 4px; }
  .side p { margin: 0 0 14px; }
  .side .pick { display: grid; gap: 2px; }
  .side .pick button { text-align: left; padding: 8px 10px; border: 0; background: none; color: var(--ink-2);
    border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
  .side .pick button:hover { background: var(--ghost); }
  .side .pick button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px var(--line); }
  .side .pick button b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-3); width: 18px; flex: none; }
  .side .pick button[aria-pressed="true"] b { color: var(--accent-text); }
  .side details { margin-top: 16px; } .side summary { cursor: pointer; }
  .side pre { white-space: pre-wrap; font-size: 11px; max-height: 50vh; overflow: auto; }

  /* phone */
  .phone { width: 393px; height: 852px; border-radius: 58px; padding: 11px; background: var(--frame); position: relative;
    box-shadow: 0 0 0 1.5px #3a3a3e, 0 40px 80px -30px rgba(0,0,0,.45), 0 12px 24px -12px rgba(0,0,0,.25); }
  .screen { width: 100%; height: 100%; border-radius: 47px; overflow: hidden; background: var(--screen);
    display: flex; flex-direction: column; position: relative; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 122px; height: 35px; border-radius: 20px; background: #000; z-index: 3; }
  .status { height: 54px; flex: none; display: flex; justify-content: space-between; align-items: center;
    padding: 4px 30px 0 36px; font-size: 16px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .status svg { display: block; fill: currentColor; }
  .status .icons { display: flex; gap: 6px; align-items: center; }

  .head { flex: none; display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; padding: 2px 12px 10px;
    border-bottom: 1px solid var(--hair); background: var(--screen); position: relative; z-index: 2; }
  .head .back { width: 36px; height: 36px; display: grid; place-items: center; color: var(--ink); }
  .head .who { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .mark { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
  .mark svg { display: block; }
  .head .nm { font-size: 12px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 2px; }
  .head .nm svg { color: var(--muted); }

  .chat { display: block; gap: 0; min-height: 0; max-height: none; margin: 0; flex: 1; overflow-y: auto; padding: 16px 14px 24px; scroll-behavior: smooth; scrollbar-width: none;
    mask-image: linear-gradient(transparent, #000 14px, #000 calc(100% - 20px), transparent); }
  .chat::-webkit-scrollbar { display: none; }
  .day { text-align: center; font-size: 11px; color: var(--muted); margin: 0 0 14px; font-weight: 500; }
  .day b { font-weight: 600; }
  .row { display: flex; margin-top: 16px; animation: in .32s cubic-bezier(.16,1,.3,1); }
  .row.cont { margin-top: 4px; }
  .row.me { justify-content: flex-end; }
  .col { max-width: 80%; display: flex; flex-direction: column; }
  .row.wide .col { max-width: 88%; width: 88%; }
  .b { background: var(--bot); color: var(--bot-ink); padding: 9px 14px; border-radius: 20px; font-size: 15px; line-height: 1.47; letter-spacing: -.005em; }
  .row.bot.cont .b { border-top-left-radius: 6px; }
  .row.bot.next .b { border-bottom-left-radius: 6px; }
  .row.me .b { background: var(--me); color: var(--me-ink); }
  .row.me.cont .b { border-top-right-radius: 6px; }
  .row.me.next .b { border-bottom-right-radius: 6px; }
  .typing .b { display: flex; gap: 4px; padding: 14px 16px; }
  .typing .b i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .4; animation: dot 1.2s infinite; }
  .typing .b i:nth-child(2) { animation-delay: .15s; } .typing .b i:nth-child(3) { animation-delay: .3s; }

  .mini, .card, .crisis { border-radius: 20px; font-size: 13px; }
  .mini { background: var(--screen); border: 1px solid var(--line); padding: 14px 14px 12px; }
  .mini .t { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .mini .t b { font-size: 13px; font-weight: 600; } .mini .t span { font-size: 11px; color: var(--muted); }
  .bars { display: grid; grid-template-columns: 16px 1fr 40px; gap: 7px 8px; align-items: center; font-variant-numeric: tabular-nums; }
  .bars span { font-size: 11px; color: var(--muted); } .bars .v { text-align: right; color: var(--ink-2); }
  .bars .bar { height: 8px; background: var(--ghost); border-radius: 4px; position: relative; overflow: hidden; }
  .bars .bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 4px; }
  .bars .bar.hot i { background: var(--accent); }
  .bars .hot + .v { color: var(--accent-text); font-weight: 600; }
  .bars .usual { position: absolute; top: -2px; bottom: -2px; width: 1.5px; background: var(--ink-3); opacity: .5; }

  .card { display: block; width: auto; align-self: auto; color: var(--ink); background: var(--screen); border: 1px solid var(--line); padding: 18px 16px 6px; font-size: 14px; line-height: 1.5; }
  .card .lbl { font-size: 11px; color: var(--muted); font-weight: 500; }
  .card .type { font-size: 20px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 12px; line-height: 1.3; }
  .card .type em { font-style: normal; font-weight: 500; color: var(--ink-2); }
  .card .pair { border-top: 1px solid var(--line); padding: 11px 0; }
  .card .pair b { display: block; font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
  .card .pair q { display: block; margin-top: 4px; color: var(--ink-2); quotes: '“' '”'; }
  .crisis { background: var(--accent-soft); color: var(--ink); padding: 14px 16px; font-size: 14px; line-height: 1.6; }
  .crisis .ln { display: flex; gap: 10px; align-items: baseline; margin-top: 6px; }
  .crisis .ln b { font-variant-numeric: tabular-nums; color: var(--accent-text); min-width: 42px; }

  .dock { flex: none; padding: 8px 12px 30px; background: var(--screen); }
  .chips { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; padding: 4px 2px 10px; }
  .chips:empty { display: none; }
  .chips button { font-size: 14px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--screen); color: var(--ink); cursor: pointer; letter-spacing: -.005em;
    transition: background .15s, border-color .15s, transform .1s; animation: in .32s cubic-bezier(.16,1,.3,1) backwards; }
  .chips button:nth-child(2) { animation-delay: .04s; } .chips button:nth-child(3) { animation-delay: .08s; } .chips button:nth-child(4) { animation-delay: .12s; }
  .chips button:hover { border-color: var(--ink-3); }
  .chips button:active { transform: scale(.96); background: var(--bot); }
  .free { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--screen); }
  .free:focus-within { border-color: var(--ink-3); }
  .free input { flex: 1; font: inherit; font-size: 15px; border: 0; outline: 0; background: none; color: var(--ink); min-width: 0; padding: 6px 0; caret-color: var(--accent); }
  .free input::placeholder { color: var(--muted); }
  .free button { width: 32px; height: 32px; flex: none; border-radius: 50%; border: 0; background: var(--accent-fill); color: var(--on-accent);
    display: grid; place-items: center; cursor: pointer; transition: opacity .15s, transform .1s; }
  .free button:active { transform: scale(.92); }
  .free input:placeholder-shown + button, .free input:disabled + button { opacity: .25; pointer-events: none; }
  .home { width: 134px; height: 5px; border-radius: 3px; background: var(--ink); position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); opacity: .9; }

  @keyframes in { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  @keyframes dot { 0%, 60%, 100% { opacity: .35; transform: none; } 30% { opacity: .9; transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) { .row, .chips button, .typing .b i { animation: none; } .chat { scroll-behavior: auto; } }
  @media (max-width: 900px) and (min-width: 701px) { .side { position: static; width: auto; max-width: 393px; margin-bottom: 20px; } body { display: flex; flex-direction: column; align-items: center; } }
  @media (max-width: 700px) {
    body { padding: 0; display: flex; flex-direction: column; align-items: stretch; height: 100dvh; }
    .side { position: static; width: auto; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
    .side strong, .side p, .side details { display: none; }
    .side .pick { grid-template-columns: repeat(4, 1fr); gap: 4px; } .side .pick button { font-size: 0; justify-content: center; padding: 6px; }
    .side .pick button b { font-size: 12px; width: auto; }
    .phone { width: 100%; flex: 1; height: auto; min-height: 0; border-radius: 0; padding: 0; background: none; box-shadow: none; }
    .screen { border-radius: 0; } .island, .status, .home { display: none; } .dock { padding-bottom: 14px; }
  }
</style>
</head>
<body>
<aside class="side">
  <strong>대본형 데모</strong><p>합성 사용자 · AI 호출 없음 · 고르거나, 원하면 직접 써요. 이상적인 흐름 대본이에요. 회색 태그는 사용자에게 안 보여요.</p>
  <div class="pick" id="pick"></div>

<div class="phone"><div class="screen">
  <div class="island"></div>
  <div class="status"><span>9:41</span><span class="icons" aria-hidden="true">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.6 6.6 0 0 0 8 4a6.6 6.6 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.5c.4 0 .8.2 1.1.4L8 11.6 6.9 9.7c.3-.2.7-.4 1.1-.4Z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".4"/></svg>
  </span></div>
  <div class="head">

      <span class="nm">마음 시간표<svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m2 2 4 4-4 4"/></svg></span>

<script type="module">
import { isCrisis, CRISIS_LINES } from '../js/safety.js';
// Ideal-flow scripts. Stage 1 = casual data talk with hidden PHQ topic tags; stage 2 = formal PHQ-9 offer only when tags pile up.
// c = [label, hidden tag or null, reaction]. Synthetic personas from testbed/personas/README.md.
const OFFER_AT = 2;
const P = {
  p4: { name: 'p4 대학원생 · 26 (괜찮은 사람)', usualSleep: 7.2,
    nights: [['월',7.1],['화',7.3],['수',7.0],['목',7.2],['금',6.9],['토',7.6],['일',7.2]],

    ],
    type: '흔들리는 밤', line: '몸도 마음도 쉬는 시간이 모자랐던 2주예요.' },
  p1: { name: 'p1 취업 준비 · 28 (지친 사람)', usualSleep: 7.15,
    nights: [['월',4.6],['화',4.2],['수',5.4],['목',3.9],['금',5.1],['토',5.0],['일',5.6]],
    steps: [
      { topic: '잠', data: '평소 7시간 넘게 → 2주째 5시간 미만', say: ['제일 달라진 건 잠이에요.', '#bars', '평소 7시간 넘게 자던 사람이 2주째 5시간을 잘 못 넘겨요.'], ask: '2주 전쯤, 뭔가 달라진 게 있었어요?',
        c: [['결과 발표가 있었어요', '기분', '그 일이 밤까지 따라온 것 같네요.'], ['준비가 길어지면서 점점', '기분', '오래 버티면 몸이 먼저 말하기도 해요.'], ['특별한 건 없어요', null, '그럼 몸이 먼저 알아챈 걸 수도 있어요.'], ['말하기 좀 그래요', null, '괜찮아요. 말 안 해도 돼요.']] },
      { topic: '다음 날', data: null, say: [], ask: '그렇게 잔 다음 날은 어때요?',
        c: [['그럭저럭 버텨요', null, '버티는 것도 힘이죠.'], ['하루 종일 무거워요', '피로', '몸이 계속 무거운 2주였군요.'], ['집중이 잘 안 돼요', '집중', '머리가 꽉 찬 느낌이겠어요.']] },
      { topic: '주말', data: '주말에도 새벽 2시 넘어 잠듦', say: ['요즘은 주말에도 새벽 2시 넘어 자요. 평일이랑 거의 같아요.'], ask: '요즘 주말이랑 평일, 구분이 있어요?',
        c: [['주말엔 쉬려고 해요', null, '쉬려고 해도 밤은 길었네요.'], ['거의 없어요', '흥미', '매일이 비슷한 요즘이군요.'], ['주말이 더 힘들어요', '기분', '쉬는 날이 오히려 버거운 요즘이군요.']] },
    ],
    type: '늦어진 밤', line: '밤이 길어지고 낮이 무거워진 2주예요. 혼자 오래 버텨 온 것 같아요.' },
};

const $ = (s) => document.querySelector(s);
const chat = $('#chat');
let st, run = 0;
const wait = (ms) => new Promise((r) => setTimeout(r, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : ms));
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function row(html, me = false, wide = false) {
  const last = chat.lastElementChild;
  const side = me ? 'me' : 'bot';
  const cont = last && last.classList.contains(side) && !last.classList.contains('typing');
  if (cont) last.classList.add('next');
  const d = document.createElement('div');
  d.className = `row ${side}${cont ? ' cont' : ''}${wide ? ' wide' : ''}`;
  d.innerHTML = `<div class="col">${me ? '<div class="b"></div>' : html.startsWith('<div') ? html : `<div class="b">${html}</div>`}</div>`;
  if (me) d.querySelector('.b').textContent = html; // user text is never parsed as HTML
  chat.append(d); chat.scrollTop = chat.scrollHeight; return d;
}
function typing() {
  const last = chat.lastElementChild;
  const t = row('<div class="b" aria-label="입력 중"><i></i><i></i><i></i></div>'); t.classList.add('typing');
  return { done() { t.remove(); if (last) last.classList.remove('next'); } };
}
async function say(text, id) {
  const t = typing();
  await wait(Math.min(1300, 400 + text.length * 16)); t.done();
  if (id !== run) return;
  row(text === '#bars' ? bars() : text, false, text === '#bars');
}
function bars() {
  const p = st.p, max = 9, hm = (h) => `${Math.floor(h)}h${String(Math.round((h % 1) * 60)).padStart(2, '0')}`;
  const minIdx = p.nights.reduce((m, n, i, a) => (n[1] < a[m][1] ? i : m), 0);
  const u = (p.usualSleep / max) * 100;
  const rows = p.nights.map((n, i) => `<span>${n[0]}</span><div class="bar${i === minIdx ? ' hot' : ''}"><i style="width:${(n[1] / max) * 100}%"></i><s class="usual" style="left:${u}%"></s></div><span class="v">${hm(n[1])}</span>`).join('');
  return `<div class="mini"><div class="t"><b>지난주 잠</b><span>세로선 = 평소 ${Math.floor(p.usualSleep)}시간 ${Math.round((p.usualSleep % 1) * 60)}분</span></div><div class="bars">${rows}</div></div>`;
}
const chips = $('#chips'), free = $('#free'), input = free.querySelector('input');
function idle() { chips.innerHTML = ''; input.value = ''; input.disabled = true; free.onsubmit = (e) => e.preventDefault(); }
// Resolves with {i} for a chip or {text} for free input. free=false keeps the composer disabled.
function choose(list, id, allowFree = true) {
  return new Promise((resolve) => {
    if (id !== run) return;
    chips.innerHTML = ''; input.disabled = !allowFree;
    const send = (label, r) => { idle(); row(label, true); resolve(r); };
    list.forEach((label, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
      b.onclick = () => send(label, { i });
      chips.append(b);
    });
    free.onsubmit = (e) => { e.preventDefault(); const v = input.value.trim(); if (allowFree && v) send(v, { text: v }); };
  });
}
async function crisis(id) {
  const t = typing(); await wait(600); t.done(); if (id !== run) return;
  row(`<div class="crisis">많이 힘든 마음을 말해 줘서 고마워요. 지금은 이 대화보다 사람과 이야기하는 게 먼저예요.${CRISIS_LINES.map((c) => `<div class="ln"><b>${c.number}</b><span>${c.name} · ${c.note}</span></div>`).join('')}</div>`, false, true);
}
async function step(s, id) {
  for (const x of s.say) { await say(x, id); if (id !== run) return false; }
  await say(s.ask, id); if (id !== run) return false;
  const pick = await choose(s.c.map((c) => c[0]), id); if (id !== run) return false;
  if (pick.text) {
    if (isCrisis(pick.text)) { await crisis(id); st.stop = true; return false; }
    st.said.push(pick.text); await say('그날 얘기 들려줘서 좋아요. 데이터만으로는 몰랐을 부분이에요.', id);
  } else {
    const [label, tag, re] = s.c[pick.i];
    st.said.push(label); if (tag) st.tags.push(tag);
    await say(re, id);
  }
  if (s.data) st.data.push(s.data);
  dbg(); return true;
}

async function start(key) {
  const id = ++run;
  st = { key, p: P[key], tags: [], said: [], data: [] };
  chat.innerHTML = '<div class="day"><b>오늘</b> 오후 9:41</div>'; idle();
  document.querySelectorAll('#pick button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.k === key));
  dbg();
  await say('워치에 2주 기록이 쌓여 있어요. 제가 먼저 하나 보여 줄까요?', id); if (id !== run) return;
  let order = [...st.p.steps];
  const first = await choose(['보여 줘', '내가 고를래'], id, false); if (id !== run) return;
  if (first.i === 1) {
    const topics = order.filter((s) => s.say.length);
    await say('뭐가 궁금해요?', id); if (id !== run) return;
    const t = await choose(topics.map((s) => s.topic), id, false); if (id !== run) return;
    const chosen = topics[t.i]; const ci = order.indexOf(chosen);
    order = [...order.slice(ci), ...order.slice(0, ci)];
  }
  for (const s of order) { const ok = await step(s, id); if (!ok) return; }
  await say('여기까지 보니 대충 보여요. 정리해 볼까요?', id); if (id !== run) return;
  await choose(['정리해 줘'], id, false); if (id !== run) return;
  await result(id);
}
async function result(id) {
  const p = st.p;
  row(`<div class="card"><div class="lbl">나의 2주 시간표</div><div class="type">${p.type}</div>
    <div class="pair"><b>몸이 말한 것</b>${st.data.join(' · ')}</div>
    <div class="pair"><b>내가 한 말</b>${st.said.map((s) => `<q>${esc(s)}</q>`).join('')}</div>
    <div class="pair"><b>한 줄</b>${p.line}</div></div>`, false, true);
  dbg();
  if (st.tags.length >= OFFER_AT) {
    await say('이 2주가 잠깐 바빴던 건지, 좀 더 오래 쌓인 건지는 데이터만으론 알기 어려워요.', id);
    await say('2분짜리 질문 9개로 더 정확히 볼 수 있는데, 해 볼래요?', id); if (id !== run) return;
    const o = await choose(['해 볼래', '다음에'], id, false); if (id !== run) return;
    if (o.i === 0) await say('(데모: 여기서 정식 PHQ-9 시트가 열려요. 문항 원문 그대로 받고, 점수는 이 시트로만 계산해요.)', id);
    else await say('좋아요. 결과 카드는 그대로 남아 있어요. 생각나면 언제든 해 봐요.', id);
  } else {
    const o = await choose(['친구한테 공유', '다른 것도 볼래'], id, false); if (id !== run) return;
    await say(o.i === 0 ? '(데모: 여기서 공유용 카드 이미지가 만들어져요.)' : '(데모: 여기서 다른 기간이나 지표를 고를 수 있어요.)', id);
  }
  const again = document.createElement('button'); again.type = 'button'; again.textContent = '다시 해 보기';
  again.onclick = () => start(st.key); chips.append(again);
}
function dbg() { $('#dbg').textContent = JSON.stringify({ persona: st.key, hidden_tags: st.tags, offer: st.tags.length >= OFFER_AT ? '정식 검사 제안' : '유형 결과로 끝', said: st.said }, null, 1); }

for (const k of ['p4', 'p3', 'p2', 'p1']) {
  const b = document.createElement('button'); b.dataset.k = k; b.innerHTML = `<b>${k}</b><span></span>`; b.lastChild.textContent = P[k].name.replace(/^p\d /, ''); b.onclick = () => start(k); $('#pick').append(b);
}
start('p4');
</script>
